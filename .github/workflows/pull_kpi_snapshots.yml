name: Pull KPI Snapshots (daily)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *" # 12:15 Berlin (CET winter). Good enough.

permissions:
  contents: write

jobs:
  pull_kpi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch KPI JSON from Apps Script
        env:
          KPI_EXPORT_URL: ${{ secrets.KPI_EXPORT_URL }}
          KPI_EXPORT_KEY: ${{ secrets.KPI_EXPORT_KEY }}
        run: |
          set -e

          echo "PWD:"
          pwd
          echo "Repo root:"
          ls -la

          echo "Ensure target dir exists:"
          mkdir -p trading/data
          ls -la trading || true
          ls -la trading/data || true

          echo "Download JSON..."
          curl -fsSL "${KPI_EXPORT_URL}?key=${KPI_EXPORT_KEY}&format=kpi_snapshots_daily" \
            -o trading/data/kpi_snapshots_daily.json

          echo "Downloaded file info:"
          ls -la trading/data
          wc -c trading/data/kpi_snapshots_daily.json
          head -c 120 trading/data/kpi_snapshots_daily.json || true
          echo ""

          echo "JSON validation..."
          python - << 'PY'
          import json
          with open("trading/data/kpi_snapshots_daily.json","r",encoding="utf-8") as f:
              json.load(f)
          print("JSON OK")
          PY

      - name: Commit if changed
        run: |
          set -e

          echo "== Git status (short) =="
          git status --porcelain=v1

          echo "== Does file exist? =="
          ls -la trading/data || true
          test -f trading/data/kpi_snapshots_daily.json && echo "File exists ✅" || (echo "File missing ❌" && exit 1)

          echo "== Is it ignored? =="
          git check-ignore -v trading/data/kpi_snapshots_daily.json || echo "Not ignored ✅"

          echo "== Show file hash =="
          sha256sum trading/data/kpi_snapshots_daily.json || true

          echo "== Git diff (name-only) =="
          git diff --name-only

          echo "== Untracked files =="
          git ls-files --others --exclude-standard | head -n 50

          if git diff --quiet && git status --porcelain=v1 | grep -q '^??'; then
            echo "There are untracked files but diff is clean."
          fi

          if git diff --quiet && git status --porcelain=v1 | grep -q '^??' ; then
            echo "Proceeding to add file explicitly..."
          fi

          git add -f trading/data/kpi_snapshots_daily.json

          echo "== Git status after add =="
          git status --porcelain=v1

          if git diff --cached --quiet; then
            echo "No staged changes. No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update kpi_snapshots_daily.json"
          git push
