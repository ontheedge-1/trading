  <!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading Dashboard</title>
  <style>
    :root{
      /* Base */
      --bg:#070b12;
      --panel:#0c1220;
      --txt:#dbe7ff;
      --muted:#8aa4d6;

      /* Brand (A: Electric Blue / Ice) */
      --blue:#2d6bff;
      --blue2:#29b6ff;

      /* States */
      --green:#35d07f;
      --red:#ff4d6d;

      /* Emerald only for Strategy Score */
      --emerald:#22c55e;
      --emerald2:#34d399;

      /* Surfaces */
      --border: rgba(120,160,255,.18);
      --border2: rgba(120,160,255,.26);

      /* Background glow */
      --bgGlow:
        radial-gradient(1200px 520px at 15% -10%, rgba(45,107,255,.22), transparent 62%),
        radial-gradient(900px 480px at 85% 0%, rgba(41,182,255,.15), transparent 58%),
        radial-gradient(700px 420px at 55% 110%, rgba(34,197,94,.10), transparent 55%);

      /* Card surfaces */
      --cardGrad: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.018));
      --cardGradStrong: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));

      /* Shadows */
      --shadow: 0 18px 44px rgba(0,0,0,.46);
      --shadowSoft: 0 12px 28px rgba(0,0,0,.34);

      /* Radii */
      --rCard: 18px;
      --rPill: 999px;
    }
body{
      margin:0;
      background: var(--bgGlow), var(--bg);
color:var(--txt);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    /* ===== TOP BAR (full-width band) ===== */
    .wrap{ max-width: 1400px; margin: 0 auto; padding: 22px; }
    .topbarBand{
      width:100%;
      border: 1px solid rgba(120,160,255,.16);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 18px 44px rgba(0,0,0,.30);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin-bottom:16px;
    }
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin:0;
    }
    .title{ font-size:28px; font-weight:800; letter-spacing:.2px; }
    .sub{ color: var(--muted); font-size: 12px; }
    .statusPills{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(120,160,255,.18);
      background: rgba(10,16,32,.35);
      color:#cfe3ff;
      font-weight:900;
      font-size:12px;
      letter-spacing:.2px;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:14px;
    }

    /* Cards inside the 12-col grid (if used) */
    .grid .card{ grid-column: span 4; }

    .card{
      position:relative;
      /* grid-column scoped below */
background: var(--cardGrad);
      border: 1px solid var(--border);
      border-radius: var(--rCard);
      padding: 14px 14px 12px 14px;
      box-shadow: var(--shadowSoft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius: inherit;
      pointer-events:none;
      background:
        radial-gradient(700px 260px at 18% 0%, rgba(45,107,255,.12), transparent 62%),
        radial-gradient(520px 240px at 92% 16%, rgba(41,182,255,.10), transparent 58%);
      opacity:.95;
    }
    .card:hover{
      transform: none;
      border-color: var(--border2);
      box-shadow: var(--shadow);
      background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
    }
    .grid .card.big{ grid-column: span 12; }
    .k{ color:var(--muted); font-size:12px; }
    .v{ font-size:24px; font-weight:900; margin-top:6px; letter-spacing:.2px; }
    .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .pill{
      font-size:12px; padding:6px 10px; border-radius:999px;
      background: rgba(45,107,255,.14);
      border: 1px solid rgba(45,107,255,.28);
      color: #bcd2ff;
      white-space:nowrap;
    }
    .good{ color:var(--green); }
    .bad{ color:var(--red); }


    /* ===== FILTER BAR ===== */

    .filters{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .filters .input{
      height:34px;
      padding:6px 10px;
      border-radius:10px;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      color: var(--text);
      outline:none;
    }

    .filters .seg.small button{
      padding:7px 10px;
      font-size:12px;
    }

    /* ===== DESKTOP LAYOUT (KPI LEFT / CHART RIGHT) ===== */

    .desktop{
      display:grid;
      grid-template-columns: 450px 1fr; /* links KPIs, rechts Chart */
      gap:14px;
      align-items:stretch; /* align chart panel to KPI panel height */
    }

    .kpiPanel{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .kpiGrid{
      display:grid;
      grid-template-columns: 1fr 1fr; /* 2 KPI-Spalten */
      gap:14px;
    }

    .chartPanel{
      padding:16px;
      background:
        radial-gradient(900px 360px at 30% 0%, rgba(41,182,255,.14), transparent 60%),
        radial-gradient(700px 320px at 90% 20%, rgba(45,107,255,.10), transparent 55%),
        var(--cardGradStrong);
    }

    .scoreCard{
      grid-column: 1 / -1;
      min-height: 120px;
    }

    
    /* Strategy Score = Emerald hero (only accent in UI) */
    #scoreCard{
      background:
        radial-gradient(760px 260px at 22% 0%, rgba(34,197,94,.18), transparent 62%),
        radial-gradient(520px 220px at 92% 16%, rgba(52,211,153,.12), transparent 58%),
        var(--cardGradStrong);
      border-color: rgba(34,197,94,.22);
    }
    #scoreCard:hover{ border-color: rgba(34,197,94,.36); }
/* Risk & Sizing optisch hervorheben */
    .card.riskAccent{
      background:
        radial-gradient(620px 240px at 22% 0%, rgba(45,107,255,.14), transparent 62%),
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      border-color: rgba(120,160,255,.32);
    }

    /* ===== END DESKTOP LAYOUT ===== */

    /* Chart */

    .chartHead{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      margin-bottom:10px;
    }
    .seg{
      display:inline-flex;
      background: rgba(10,16,32,.58);
      border: 1px solid rgba(120,160,255,.20);
      border-radius: var(--rPill);
      padding: 4px;
      gap: 4px;
      box-shadow: 0 10px 24px rgba(0,0,0,.22) inset;
    }
    .seg button{
      appearance:none; border:0; cursor:pointer;
      background: transparent;
      color: #bcd2ff;
      padding: 8px 10px;
      border-radius: var(--rPill);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .2px;
      transition: background .15s ease, color .15s ease, transform .12s ease;
    }
    .seg button:hover{ transform: none; }
    .seg button.active{
      background: linear-gradient(180deg, rgba(45,107,255,.30), rgba(41,182,255,.16));
      border: 1px solid rgba(45,107,255,.34);
      color: #e7f0ff;
    }
    .chartWrap{
      position:relative;
      border-radius:16px;
      overflow:hidden;
      border: 1px solid var(--border);
      background:
        radial-gradient(900px 360px at 30% 0%, rgba(41,182,255,.14), transparent 62%),
        radial-gradient(720px 320px at 90% 20%, rgba(45,107,255,.10), transparent 58%),
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      box-shadow: 0 18px 44px rgba(0,0,0,.35);
      flex: 1 1 auto;
      min-height: 420px;
      display:flex;
    }
    .chartWrap::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background: radial-gradient(620px 280px at 50% 0%, rgba(41,182,255,.10), transparent 60%);
      mix-blend-mode: screen;
      opacity:.65;
    }
    canvas{ display:block; width:100%; height:100%; }
    .tooltip{
      position:absolute;
      pointer-events:none;
      transform: translate(-50%, -110%);
      background: rgba(10,16,32,.92);
      border: 1px solid rgba(120,160,255,.25);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      color: #e7f0ff;
      box-shadow: 0 12px 30px rgba(0,0,0,.45);
      white-space: nowrap;
      display:none;
    }
    .tooltip .muted{ color: var(--muted); font-size: 11px; margin-top: 2px; }
    .hint{ display:none; }

    pre{
      margin:0; overflow:auto; padding:12px;
      background: rgba(10,16,32,.6);
      border: 1px solid var(--border);
      border-radius:12px;
      color:#cfe0ff;
      font-size:12px;
    }

    /* ===== CALENDAR VIEW ===== */
    .calendarWrap{
      display:none;
      border-radius:14px;
      overflow:hidden;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      flex: 1 1 auto;
      min-height: 420px;
      display:flex;
      flex-direction:column;
    }
    .calHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px 8px 12px;
      border-bottom: 1px solid rgba(120,160,255,.14);
      background: rgba(10,16,32,.35);
    }
    .calNav{
      display:flex;
      align-items:center;
      gap:8px;
      min-width: 240px;
    }
    .iconBtn{
      appearance:none;
      border:1px solid rgba(120,160,255,.22);
      background: rgba(255,255,255,.03);
      color:#cfe0ff;
      width:34px;
      height:34px;
      border-radius:10px;
      cursor:pointer;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1;
    }
    .iconBtn:disabled{
      opacity:.35;
      cursor:default;
    }
    .calTitle{
      font-weight:900;
      letter-spacing:.2px;
      white-space:nowrap;
    }
    .chipRow{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      flex-wrap:wrap;
    }
    .chip{
      appearance:none;
      border:1px solid rgba(120,160,255,.22);
      background: rgba(255,255,255,.02);
      color:#bcd2ff;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
      line-height:1;
    }
    .chip.active{
      background: rgba(45,107,255,.22);
      border-color: rgba(45,107,255,.32);
      color:#e7f0ff;
    }
    .calGrid{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      flex: 1 1 auto;
      min-height: 0;
      overflow:auto;
    }
    .calDow{
      padding:10px 10px 8px 10px;
      font-size:11px;
      color: rgba(138,164,214,.95);
      border-bottom: 1px solid rgba(120,160,255,.10);
      background: rgba(10,16,32,.25);
      letter-spacing:.2px;
      text-transform:uppercase;
    }
    .dayCell{
      position:relative;
      min-height:78px;
      padding:10px;
      border-right: 1px solid rgba(120,160,255,.10);
      border-bottom: 1px solid rgba(120,160,255,.10);
      background: rgba(255,255,255,.01);
    }
    .dayCell:nth-child(5n){
      border-right:none;
    }
    .dayCell.outMonth{
      background: rgba(255,255,255,.005);
      opacity:.35;
    }
    .dayCell.outRange{
      opacity:.32;
      filter: grayscale(.2);
    }
    .dayTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:8px;
      margin-bottom:8px;
    }

    /* ===== CALENDAR COMPACT BADGE LAYOUT (single chip row top-right) ===== */
    .dayCell{ padding:8px; min-height:54px; }
    .dayTop{ margin-bottom:4px; }
    .dayBadges{
      position:absolute;
      top:8px;
      right:8px;
      display:flex;
      flex-direction:row;
      gap:6px;
      align-items:center;
      justify-content:flex-end;
      pointer-events:none;
      white-space:nowrap;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:10px;
      padding:3px 7px;
      border-radius:999px;
      border:1px solid rgba(120,160,255,.18);
      background: rgba(10,16,32,.38);
      box-shadow: 0 10px 22px rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      line-height:1;
    }
    .badge.round{ width:auto; height:auto; padding:3px 7px; border-radius:999px; }
    /* Calendar header toggle chips */
    .calMode{
      display:inline-flex;
      gap:6px;
      padding:4px;
      border-radius:999px;
      border:1px solid rgba(120,160,255,.18);
      background: rgba(10,16,32,.45);
    }
    .calMode button{
      appearance:none; border:0; cursor:pointer;
      background: transparent;
      color:#bcd2ff;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.2px;
    }
    .calMode button.active{
      background: linear-gradient(180deg, rgba(45,107,255,.30), rgba(41,182,255,.16));
      border: 1px solid rgba(45,107,255,.34);
      color:#e7f0ff;
    }
    .badge.pos{ border-color: rgba(53,208,127,.22); }
    .badge.neg{ border-color: rgba(255,77,109,.22); }
    .dayNum{
      font-weight:900;
      font-size:12px;
      color:#e7f0ff;
    }
    
    .dayBadges{
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:flex-end;
      justify-content:flex-start;
      flex-wrap:nowrap;
    }
    .badge.round{
      width:34px;
      height:34px;
      padding:0;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      letter-spacing:.2px;
    }
    .badge{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(120,160,255,.18);
      background: rgba(255,255,255,.02);
      color:#bcd2ff;
      white-space:nowrap;
    }
    .badge.good{
      border-color: rgba(53,208,127,.30);
      background: rgba(53,208,127,.10);
      color:#c8f7df;
    }
    .badge.bad{
      border-color: rgba(255,77,109,.30);
      background: rgba(255,77,109,.10);
      color:#ffd1db;
    }
    .mini{
      font-size:11px;
      color: rgba(138,164,214,.92);
      line-height:1.25;
    }
    .mini strong{
      color:#e7f0ff;
      font-weight:900;
    }


    .dayCell.good{
      background: rgba(53,208,127,.22);
      box-shadow: inset 0 0 0 1px rgba(53,208,127,.10);
    }
    .dayCell.bad{
      background: rgba(255,77,109,.22);
      box-shadow: inset 0 0 0 1px rgba(255,77,109,.10);
    }
    .dayCell.good .dayNum,
    .dayCell.bad .dayNum{
      color:#f4f8ff;
    }

    /* ===== END CALENDAR VIEW ===== */
    /* Statement polish */
    .k{ font-size:12px; letter-spacing:.25px; text-transform: none; }
    .kpiGrid .card .k{ color: rgba(170,200,255,.92); }
    .kpiGrid .card .v{ font-size:26px; }
    .kpiGrid .card{ box-shadow: 0 14px 34px rgba(0,0,0,.40); }
    /* ===== Phase 1 polish: topbar + rhythm ===== */
    header{
      position: relative;
      padding: 18px 0 10px 0;
    }
    .topbar{
      align-items:center;
      gap:12px;
    }
    .titleRow{
      display:flex;
      align-items:flex-end;
      gap:12px;
      flex-wrap:wrap;
    }
    .subtitle{ line-height:1.35; }
    .chartHead{
      align-items:flex-start;
      gap:10px;
    }
    .chartTitle{ line-height:1.15; }




    @media (max-width: 900px){
      .card{ grid-column: span 12; }
      canvas{ display:block; width:100%; height:100%; }
    }
  
    /* ===== Phase 1: Institutional Topbar ===== */
    .topbarBand{
      border: 1px solid rgba(120,160,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 18px 44px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin-bottom: 14px;
    }
    .topbarGrid{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap: 12px;
    }
    .topbarLeft{ display:flex; align-items:center; }
    .topbarCenter{ display:flex; justify-content:center; }
    .topbarRight{ display:flex; justify-content:flex-end; }

    .title{
      font-size: 26px;
      font-weight: 900;
      letter-spacing: .2px;
      color: #e8f0ff;
    }

    /* tighter, more "terminal" segmented */
    .seg.segTight{
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(120,160,255,.18);
      background: rgba(10,16,32,.40);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }
    .seg.segTight button{
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .15px;
      color: #cfe0ff;
      border-radius: 999px;
    }
    .seg.segTight button.active{
      background: linear-gradient(180deg, rgba(45,107,255,.32), rgba(41,182,255,.14));
      border: 1px solid rgba(45,107,255,.34);
      color:#f1f6ff;
      box-shadow: 0 12px 24px rgba(0,0,0,.25);
    }

    .filters#filtersBar{ display:flex; align-items:center; gap:10px; }

    .select{
      height: 34px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 900;
      border-radius: 10px;
      border: 1px solid rgba(120,160,255,.18);
      background: rgba(10,16,32,.32);
    }

    /* ===== KPI Statement Cards ===== */
    .kpiGrid{ gap: 12px; }
    .card{
      background:
        radial-gradient(900px 360px at 30% 0%, rgba(41,182,255,.10), transparent 62%),
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.012));
      border: 1px solid rgba(120,160,255,.16);
      box-shadow: 0 18px 44px rgba(0,0,0,.32);
    }
    .card .kTitle{
      font-size: 12px;
      letter-spacing: .2px;
      color: rgba(188,210,255,.82);
      margin-bottom: 8px;
    }
    .card .kValue{
      font-size: 30px;
      font-weight: 900;
      letter-spacing: .2px;
      color:#e8f0ff;
      line-height: 1.05;
      margin-bottom: 10px;
    }
    .card .kMeta{
      font-size: 12px;
      color: rgba(188,210,255,.72);
      line-height: 1.45;
    }

    /* ===== HERO SCORE CARD (reference style) ===== */
    .scoreCard{
      position: relative;
      padding: 18px 18px 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(53,208,127,.24);
      background:
        radial-gradient(900px 420px at 20% 0%, rgba(53,208,127,.16), transparent 62%),
        radial-gradient(900px 420px at 80% 10%, rgba(41,182,255,.10), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.012));
      box-shadow: 0 22px 60px rgba(0,0,0,.38);
      overflow:hidden;
    }
    .scoreCard::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(520px 220px at 50% 15%, rgba(151,255,198,.18), transparent 65%);
      pointer-events:none;
      mix-blend-mode: screen;
      opacity:.9;
    }
    .scoreTop{
      text-align:center;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .24px;
      color: rgba(222,255,240,.88);
      margin-bottom: 10px;
    }
    .scorePill{
      position: relative;
      width: 100%;
      display:flex;
      justify-content:center;
      align-items:center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(151,255,198,.28);
      background:
        radial-gradient(420px 120px at 50% 0%, rgba(151,255,198,.32), transparent 60%),
        linear-gradient(180deg, rgba(53,208,127,.24), rgba(53,208,127,.10));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        0 18px 44px rgba(0,0,0,.30);
      text-shadow: 0 8px 20px rgba(0,0,0,.40);
    }
    .scorePill span{
      font-size: 28px;
      font-weight: 950;
      letter-spacing: .6px;
      color:#f4fff9;
    }
    .scoreStats{
      margin-top: 10px;
      display:flex;
      justify-content:center;
      gap: 14px;
      color: rgba(222,255,240,.78);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .2px;
    }
    .scoreStats .dot{ opacity:.6; }

    /* Layout: make left and right match topbar width (wrap already) */
    .wrap{ max-width: 1400px; margin: 0 auto; padding: 22px; }

    /* Responsive topbar */
    @media (max-width: 900px){
      .topbarGrid{ grid-template-columns: 1fr; gap: 10px; }
      .topbarCenter{ justify-content:flex-start; }
      .topbarRight{ justify-content:flex-start; }
    }


    /* ===== Score color variants (glow depends on label) ===== */
    .scoreCard{ --glow: rgba(151,255,198,.38); }
    .scoreCard.score-strong{ --glow: rgba(151,255,198,.44); }
    .scoreCard.score-good,
    .scoreCard.score-ok,

<script>
  
  // Calendar cell badge mode (default)
  let calendarBadgeMode = "pnl"; // pnl | tr
const $ = (id) => document.getElementById(id);

  const fmtUSD = (n) => {
    if (n === null || n === undefined || Number.isNaN(Number(n))) return "—";
    return Number(n).toLocaleString("en-US", { style:"currency", currency:"USD" });
  };

  const fmtUSD0 = (n) => {
    if (n === null || n === undefined || Number.isNaN(Number(n))) return "—";
    return Number(n).toLocaleString("en-US", { style:"currency", currency:"USD", maximumFractionDigits:0, minimumFractionDigits:0 });
  };

  const fmtR = (n) => {
    const x = Number(n);
    if(!Number.isFinite(x)) return "—";
    const abs = Math.abs(x);
    const decimals = abs >= 10 ? 1 : 2;
    const val = abs.toFixed(decimals);
    return (x < 0 ? "-" : "+") + val + "R";
  };

  const fmtCumR = (n) => {
    const x = Number(n);
    if(!Number.isFinite(x)) return "—";
    const val = Math.abs(x).toFixed(1);
    return (x < 0 ? "-" : "+") + val + "R";
  };



  const fmtPct = (p) => {
    if (p === null || p === undefined || Number.isNaN(Number(p))) return "—";
    return (Number(p) * 100).toFixed(2) + "%";
  };

  async function loadJSON(path){
    const res = await fetch(path, { cache: "no-store" });
    if(!res.ok) throw new Error(`${path} HTTP ${res.status}`);
    return await res.json();
  }

  function isoToday(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function isoFromDate(dateObj){
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth()+1).padStart(2,"0");
    const day = String(dateObj.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function computePresetRange(preset, trades){
    const t = Array.isArray(trades) ? trades : [];
    const dates = t.map(x => x.trade_date || x.date).filter(Boolean).sort();
    const minD = dates[0] || null;
    const maxD = dates[dates.length-1] || null;

    if(preset === "ALL") return { dateStart: null, dateEnd: null };

    // Presets always end at TODAY (Variant A)
    const end = isoToday();
    const endDate = new Date(end + "T00:00:00");


    if(preset === "YTD"){
      const start = `${endDate.getFullYear()}-01-01`;
      return { dateStart: start, dateEnd: end };
    }

    const days =
      preset === "30D" ? 30 :
      preset === "90D" ? 90 :
      preset === "180D" ? 180 : null;

    if(!days) return { dateStart: minD, dateEnd: maxD };

    const startDate = new Date(endDate);
    startDate.setDate(startDate.getDate() - (days - 1));
    const start = isoFromDate(startDate);

    return { dateStart: start, dateEnd: end };
  }

  function uniqueInstruments(trades){
    const set = new Set();
    for(const tr of (trades || [])){
      const inst = tr?.instrument || tr?.symbol;
      if(inst) set.add(inst);
    }
    return Array.from(set).sort();
  }

  
  function filterEngine(rawTrades, filters){
    if(!Array.isArray(rawTrades)) return [];

    const { dateStart, dateEnd, instrument } = filters || {};

    const out = rawTrades
      .map((t, idx) => ({ ...t, __idx: idx }))
      .filter(t => {
        if(!t) return false;
        const d = t.trade_date || t.date;
        if(!d) return false;

        if(dateStart && d < dateStart) return false;
        if(dateEnd && d > dateEnd) return false;

        if(instrument && instrument !== "ALL"){
          if(t.instrument !== instrument) return false;
        }
        return true;
      });


    // Stable deterministic ordering: date (trade_date OR date), then trade_id
  out.sort((a, b) => {
    const ad = a.trade_date || a.date || "";
    const bd = b.trade_date || b.date || "";

    if (ad < bd) return -1;
    if (ad > bd) return 1;

    const aId = a.trade_id || "";
    const bId = b.trade_id || "";

    if (aId < bId) return -1;
    if (aId > bId) return 1;

    return (a.__idx ?? 0) - (b.__idx ?? 0);
  });

  return out;
  }


  function computeTradeKPIs(trades){
    const t = Array.isArray(trades) ? trades : [];
    const n = t.length;

    let wins = 0;
    let losses = 0;

    let sumR = 0;
    let sumWinR = 0;
    let sumLossR = 0; // negative sum (z.B. -12.5)

    for (const tr of t){
      const r = Number(tr?.result_r ?? tr?.r ?? 0);
      if (!Number.isFinite(r)) continue;

      sumR += r;

      if (r > 0){
        wins += 1;
        sumWinR += r;
      } else if (r < 0){
        losses += 1;
        sumLossR += r;
      }
      // r == 0: neutral trade zählt in n, aber nicht als win/loss
    }

    const winrate = (wins + losses) > 0 ? wins / (wins + losses) : null;

    const avgR = n > 0 ? sumR / n : null;
    const avgWin = wins > 0 ? sumWinR / wins : null;
    const avgLoss = losses > 0 ? sumLossR / losses : null; // negativ

    const grossLossAbs = Math.abs(sumLossR);
    const profitFactor =
      grossLossAbs > 0 ? (sumWinR / grossLossAbs) :
      (sumWinR > 0 ? Infinity : null);

    // Expectancy (klassisch): WR*AvgWin + (1-WR)*AvgLoss
    // (AvgLoss ist negativ)
    const expectancy =
      (winrate !== null && avgWin !== null && avgLoss !== null)
        ? (winrate * avgWin + (1 - winrate) * avgLoss)
        : avgR; // fallback (bei wenig Daten gleichwertig)

    return {
      tradeCount: n,
      wins,
      losses,
      winrate,      // 0..1 oder null
      avgR,         // R/trade
      avgWin,       // R
      avgLoss,      // R (negativ)
      profitFactor, // number | Infinity | null
      expectancy    // R/trade
    };
  }

  function computeTradeStreaks(trades){
  // Neutral trades (R==0) are ignored and do NOT break streaks
  let curW = 0, curL = 0;
  let maxW = 0, maxL = 0;

  let sumW = 0, cntW = 0;
  let sumL = 0, cntL = 0;

  let last = null; // "W" | "L" | null

  for(const tr of (trades || [])){
    const r = Number(tr?.result_r ?? tr?.r ?? 0);
    if(!Number.isFinite(r) || r === 0) continue;

    const s = r > 0 ? "W" : "L";

    if(s === "W"){
      if(last === "L"){ sumL += curL; cntL += 1; curL = 0; }
      curW += 1; curL = 0;
      maxW = Math.max(maxW, curW);
    } else {
      if(last === "W"){ sumW += curW; cntW += 1; curW = 0; }
      curL += 1; curW = 0;
      maxL = Math.max(maxL, curL);
    }
    last = s;
  }

  // close open streak
  if(last === "W"){ sumW += curW; cntW += 1; }
  if(last === "L"){ sumL += curL; cntL += 1; }

  return {
    longestWin: maxW,
    longestLoss: maxL,
    avgWin: cntW ? (sumW / cntW) : 0,
    avgLoss: cntL ? (sumL / cntL) : 0
  };
}

function aggregateDailyRFromTrades(trades){
  const map = new Map(); // date -> sumR
  for(const tr of (trades || [])){
    const d = tr?.trade_date || tr?.date;
    if(!d) continue;
    const r = Number(tr?.result_r ?? tr?.r ?? 0);
    if(!Number.isFinite(r)) continue;
    map.set(d, (map.get(d) || 0) + r);
  }
  // return sorted array by date
  return [...map.entries()]
    .sort((a,b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)
    .map(([date, dailyR]) => ({ date, dailyR }));
}


  function buildCumRSeriesFromDailyR(dailyRows){
    let cum = 0;
    return (dailyRows || []).map(row => {
      const r = Number(row?.dailyR ?? 0);
      cum += (Number.isFinite(r) ? r : 0);
      return cum; // <-- nur Zahl, passend zum Chart
    });
  }

  function buildCumRSeriesOnSpine(spineDates, dailyRows){
    // spineDates: ["YYYY-MM-DD", ...] (calendar spine)
    // dailyRows: [{date, dailyR}] only for trade-days
    const map = new Map();
    for(const row of (dailyRows || [])){
      if(row?.date) map.set(row.date, Number(row.dailyR) || 0);
    }

    let cum = 0;
    return (spineDates || []).map(d => {
      const r = map.get(d) || 0;   // missing day => 0R
      cum += r;
      return cum;
    });
  }

  
  function computeDayStreaksFromDailyR(dailyRows){
    // Neutral days (dailyR==0) ignored and do NOT break streaks
    let curW = 0, curL = 0;
    let maxW = 0, maxL = 0;

    let sumW = 0, cntW = 0;
    let sumL = 0, cntL = 0;

    let last = null;

    for(const row of (dailyRows || [])){
      const r = Number(row?.dailyR ?? 0);
      if(!Number.isFinite(r) || r === 0) continue;

      const s = r > 0 ? "W" : "L";

      if(s === "W"){
        if(last === "L"){ sumL += curL; cntL += 1; curL = 0; }
        curW += 1; curL = 0;
        maxW = Math.max(maxW, curW);
      } else {
        if(last === "W"){ sumW += curW; cntW += 1; curW = 0; }
        curL += 1; curW = 0;
        maxL = Math.max(maxL, curL);
      }
      last = s;
    }

    if(last === "W"){ sumW += curW; cntW += 1; }
    if(last === "L"){ sumL += curL; cntL += 1; }

    return {
      longestWinDays: maxW,
      longestLossDays: maxL,
      avgWinDays: cntW ? (sumW / cntW) : 0,
      avgLossDays: cntL ? (sumL / cntL) : 0
    };
  }


  function clamp(x, lo, hi){ return Math.min(hi, Math.max(lo, x)); }
function lerp(a,b,t){ return a + (b-a)*t; }

function scoreBaseFromExpectancy(exp){
  // maps expectancy to 0..70 (linear), then clamp
  // <= -0.20 => 0
  // >= +0.30 => 70
  const e = Number(exp);
  if(!Number.isFinite(e)) return 0;

  const minE = -0.20;
  const maxE =  0.30;

  const t = clamp((e - minE) / (maxE - minE), 0, 1);
  return 70 * t;
}

function modifierFromRange(value, minVal, maxVal, minMod, maxMod){
  // linear mapping value -> modifier
  const v = Number(value);
  if(!Number.isFinite(v)) return 0;

  const t = clamp((v - minVal) / (maxVal - minVal), 0, 1);
  return lerp(minMod, maxMod, t);
}

function computeRecoveryFactor(trades){
  // Recovery Factor = Net Profit (R) / Max Drawdown (R)
  // uses cumulative R over trade sequence (filtered + sorted)
  let cum = 0;
  let peak = 0;
  let maxDD = 0;
  let net = 0;

  for(const tr of (trades || [])){
    const r = Number(tr?.result_r ?? tr?.r ?? 0);
    if(!Number.isFinite(r)) continue;

    net += r;
    cum += r;
    if(cum > peak) peak = cum;

    const dd = peak - cum; // >= 0
    if(dd > maxDD) maxDD = dd;
  }

  if(maxDD <= 0){
    // no drawdown: if net>0 => "infinite" recovery, else undefined-ish
    if(net > 0) return Infinity;
    return null;
  }
  return net / maxDD;
}

function labelFromScore(s){
  if(s < 40) return "WEAK";
  if(s < 60) return "OK";
  if(s < 75) return "GOOD";
  return "STRONG";
}

function colorFromScore(s){
  // continuous gradient: red -> yellow -> white -> green
  // piecewise interpolation across 3 segments
  const clampS = clamp(s, 0, 100);

  const RED   = [255,  77, 109];
  const YELL  = [255, 200,  80];
  const WHITE = [235, 242, 255];
  const GREEN = [ 53, 208, 127];

  let a, b, t;
  if(clampS <= 50){
    a = RED; b = YELL; t = clampS / 50;
  } else if(clampS <= 75){
    a = YELL; b = WHITE; t = (clampS - 50) / 25;
  } else {
    a = WHITE; b = GREEN; t = (clampS - 75) / 25;
  }

  const r = Math.round(lerp(a[0], b[0], t));
  const g = Math.round(lerp(a[1], b[1], t));
  const bl = Math.round(lerp(a[2], b[2], t));
  return `rgb(${r},${g},${bl})`;
}

function computeScore(filteredTrades, tradeKPIs){
    const n = filteredTrades?.length || 0;

    const expectancy = tradeKPIs?.expectancy ?? null;
    const pf = tradeKPIs?.profitFactor ?? null;

    // If you don't have Sharpe yet, we treat it as neutral (0 modifier)
    // Later you can compute it and pass it here.
    const sharpe = tradeKPIs?.sharpe ?? null;

    const rec = computeRecoveryFactor(filteredTrades);

    // Base 0..70 from expectancy
    const base = scoreBaseFromExpectancy(expectancy);

    // Modifiers (each ±10)
    // PF: 1.0 => -10, 1.8 => +10 (clamped)
    const modPF = modifierFromRange(pf === Infinity ? 3.0 : pf, 1.0, 1.8, -10, +10);

    // Sharpe: 0.0 => -10, 1.6 => +10
    const modSharpe = modifierFromRange(sharpe, 0.0, 1.6, -10, +10);

    // Recovery: 0.8 => -10, 2.0 => +10 (Infinity treated as max)
    const recVal = (rec === Infinity) ? 3.0 : rec;
    const modRec = modifierFromRange(recVal, 0.8, 2.0, -10, +10);

    let score = base + modPF + modSharpe + modRec;
    score = clamp(score, 0, 100);

    const label = labelFromScore(score);
      // Score color class on hero card
      const scoreEl = $("scoreCard");
      if(scoreEl){
        scoreEl.classList.remove("score-strong","score-good","score-ok","score-average","score-weak","score-poor");
        const _lab = String(label || "").toLowerCase();
        const cls =
          _lab.includes("strong") ? "score-strong" :
          (_lab.includes("good") || _lab.includes("excellent")) ? "score-good" :
          (_lab.includes("ok") || _lab.includes("neutral")) ? "score-ok" :
          _lab.includes("average") ? "score-average" :
          (_lab.includes("weak") || _lab.includes("bad") || _lab.includes("poor") || _lab.includes("terrible")) ? "score-weak" :
          "";
        if(cls) scoreEl.classList.add(cls);
      }
const color = colorFromScore(score);

    return {
      nTrades: n,
      score,
      label,
      color,
      base,
      modPF,
      modSharpe,
      modRec,
      profitFactor: pf,
      expectancy,
      sharpe,
      recoveryFactor: rec
    };
  }


  function hasDateFilter(){
    return !!(GLOBAL?.filters?.dateStart || GLOBAL?.filters?.dateEnd);
  }

  function sliceSpineByRange(fullSpine, dateStart, dateEnd){
    if(!Array.isArray(fullSpine) || !fullSpine.length) return [];
    if(!dateStart && !dateEnd) return fullSpine.slice();

    const s = dateStart || fullSpine[0];
    const e = dateEnd   || fullSpine[fullSpine.length-1];

    return fullSpine.filter(d => d >= s && d <= e);
  }

  function sliceSeriesToView(fullSpine, fullSeries, viewSpine){
    // assumes fullSeries aligned to fullSpine
    const idx = new Map();
    for(let i=0;i<(fullSpine||[]).length;i++) idx.set(fullSpine[i], i);

    return (viewSpine||[]).map(d => {
      const i = idx.get(d);
      return (i === undefined) ? null : fullSeries[i];
    });
  }

  function dailyRMapFromRows(dailyRows){
    const map = new Map();
    for(const row of (dailyRows || [])){
      if(!row?.date) continue;
      map.set(row.date, Number(row.dailyR) || 0);
    }
    return map;
  }

  function buildCumR_Rebased_OnView(viewSpine, dailyRows){
    // 1 value per day (aligned to viewSpine), rebased so first day baseline is 0
    const map = dailyRMapFromRows(dailyRows);
    let cum = 0;
    const out = (viewSpine||[]).map(d => {
      const r = map.get(d) || 0;
      cum += r;
      return cum;
    });

    // Rebase: start at 0 (so subtract first-day "carry", which is 0 anyway here)
    // (kept for clarity/extension)
    return out;
  }

  function addBaselinePointSameDay(viewSpine, values, baselineValue){
    // duplicates the first date so the first day shows baseline -> day1 value
    if(!Array.isArray(viewSpine) || viewSpine.length === 0) return { spine: [], values: [] };

    const d0 = viewSpine[0];
    const v0 = Array.isArray(values) && values.length ? values[0] : null;

    const spine2 = [d0, ...viewSpine];
    const values2 = [baselineValue, ...values];

    // After insertion, the "first real day value" becomes values2[1]
    // so you see a line from baselineValue -> v0 on the same date.
    return { spine: spine2, values: values2 };
  }

  function computeDrawdownSeriesFromCum(values){
    // values: cum curve values aligned to the chart spine (incl baseline point)
    let peak = -Infinity;
    return (values || []).map(v => {
      const x = Number(v);
      if(!Number.isFinite(x)) return 0;
      if(x > peak) peak = x;
      return x - peak; // <= 0 (0 at peak)
    });
  }


  function buildActiveDaySequence({ trades, dailyAgg, dateStart, dateEnd, instrument }) {
  // Rules:
  // - active day if: has Trades OR has dailyPnL entry
  // - inactive day (no trades AND no dailyPnL) => ignored (does not break)
  // - if instrument != "ALL": we use ONLY trades to define activity & sign
  //   (because dailyPnL is account-wide, not instrument-specific)

  const useDailyAgg = (instrument === "ALL");

  const tradeDayMap = new Map(); // date -> sumR (from filtered trades)
  for (const tr of (trades || [])) {
    const d = tr?.trade_date || tr?.date;
    if (!d) continue;
    const r = Number(tr?.result_r ?? tr?.r ?? 0);
    if (!Number.isFinite(r)) continue;
    tradeDayMap.set(d, (tradeDayMap.get(d) || 0) + r);
  }

  const pnlDayMap = new Map(); // date -> daily_pnl_$ (or similar)
  if (useDailyAgg) {
    for (const row of (dailyAgg || [])) {
      const d = row?.date;
      if (!d) continue;

      // try common field names (adjust if yours differ)
      const pnl =
        (row.daily_pnl_$ ?? row.daily_pnl ?? row.dailyPnl ?? row.pnl ?? null);

      if (pnl === null || pnl === undefined) continue;
      const x = Number(pnl);
      if (!Number.isFinite(x)) continue;
      pnlDayMap.set(d, x);
    }
  }

  // union of active dates
  const activeDatesSet = new Set();
  for (const d of tradeDayMap.keys()) activeDatesSet.add(d);
  if (useDailyAgg) for (const d of pnlDayMap.keys()) activeDatesSet.add(d);

  // apply date range
  const dates = Array.from(activeDatesSet)
    .filter(d => (!dateStart || d >= dateStart) && (!dateEnd || d <= dateEnd))
    .sort(); // YYYY-MM-DD lexicographically safe

  // build sequence of outcomes per active day
  // outcome: "W" | "L" | "F" (flat)
  const seq = [];
  for (const d of dates) {
    let val = null;

    if (useDailyAgg && pnlDayMap.has(d)) {
      val = pnlDayMap.get(d); // dailyPnL sign
    } else if (tradeDayMap.has(d)) {
      val = tradeDayMap.get(d); // fallback sign from trades (sumR)
    } else {
      // should not happen due to union set
      continue;
    }

    const outcome = (val > 0) ? "W" : (val < 0) ? "L" : "F";
    seq.push({ date: d, outcome, value: val });
  }

  return seq;
}

  function computeStreakFrequencyFromSequence(seq){
    // Flat days break streak and are not counted.
    // Inactive days are already removed by buildActiveDaySequence.
    const winFreq = {};
    const lossFreq = {};

    let curType = null; // "W" | "L" | null
    let curLen = 0;

    const closeStreak = () => {
      if (!curType || curLen <= 0) return;
      const bucket = (curType === "W") ? winFreq : lossFreq;
      bucket[curLen] = (bucket[curLen] || 0) + 1;
      curType = null;
      curLen = 0;
    };

    for (const day of (seq || [])) {
      const o = day?.outcome;
      if (o === "F") {
        // flat breaks immediately
        closeStreak();
        continue;
      }

      if (o !== "W" && o !== "L") continue;

      if (curType === null) {
        curType = o;
        curLen = 1;
      } else if (curType === o) {
        curLen += 1;
      } else {
        closeStreak();
        curType = o;
        curLen = 1;
      }
    }
    closeStreak();

    // compute max length for chart axis later
    const maxWin = Math.max(0, ...Object.keys(winFreq).map(Number));
    const maxLoss = Math.max(0, ...Object.keys(lossFreq).map(Number));
    const maxLen = Math.max(maxWin, maxLoss);

    return { winFreq, lossFreq, maxLen };
  }

  
  
  function recomputeAnalysis(){
    GLOBAL.filteredTrades = filterEngine(GLOBAL.trades, GLOBAL.filters);

    GLOBAL.tradeKPIs = computeTradeKPIs(GLOBAL.filteredTrades);
    GLOBAL.tradeStreaks = computeTradeStreaks(GLOBAL.filteredTrades);

    const dailyRows = aggregateDailyRFromTrades(GLOBAL.filteredTrades);
    GLOBAL.dayStreaks = computeDayStreaksFromDailyR(dailyRows);

    // keep raw filtered daily rows (trade-days only)
    GLOBAL.seriesDailyR_F = dailyRows;

    // ---- VIEW AXIS (date-range affects X-axis) ----
    const ds = GLOBAL.filters?.dateStart || null;
    const de = GLOBAL.filters?.dateEnd   || null;

    GLOBAL.viewSpine = sliceSpineByRange(GLOBAL.spine, ds, de);

    // ---- Day streak frequency distribution (filter reactive) ----
    const seq = buildActiveDaySequence({
      trades: GLOBAL.filteredTrades,      // filtered trades (instrument/date)
      dailyAgg: GLOBAL.dailyAgg,          // account-wide daily pnl (date only)
      dateStart: ds,
      dateEnd: de,
      instrument: GLOBAL.filters?.instrument || "ALL"
    });
    GLOBAL.dayStreakDist = computeStreakFrequencyFromSequence(seq);


    // ---- CumR (rebased to 0 on period start, aligned to viewSpine) ----
    const cumView = buildCumR_Rebased_OnView(GLOBAL.viewSpine, dailyRows);
    const cumWithBaseline = addBaselinePointSameDay(GLOBAL.viewSpine, cumView, 0);
    GLOBAL.viewCumR = cumWithBaseline.values;
    GLOBAL.viewDD = computeDrawdownSeriesFromCum(GLOBAL.viewCumR);


    // ---- Equity (global equity sliced to viewSpine, baseline = previous day equity) ----
    const eqView = sliceSeriesToView(GLOBAL.spine, GLOBAL.seriesEquity, GLOBAL.viewSpine);

    // carry-in = equity value from day before view start (if exists), else first day value
    let carryIn = (eqView && eqView.length) ? eqView[0] : null;
    if(GLOBAL.viewSpine.length){
      const startDate = GLOBAL.viewSpine[0];
      const fullIdx = GLOBAL.spine.indexOf(startDate);
      if(fullIdx > 0){
        const prev = GLOBAL.seriesEquity[fullIdx - 1];
        if(prev !== undefined && prev !== null) carryIn = prev;
      }
    }
    const eqWithBaseline = addBaselinePointSameDay(GLOBAL.viewSpine, eqView, carryIn);
    GLOBAL.viewEquity = eqWithBaseline.values;

    // IMPORTANT: viewSpine must match the series that have baseline point
    // so we store a "spine used for chart" with duplicated first day:
    GLOBAL._chartSpine = cumWithBaseline.spine; // same structure as eqWithBaseline.spine

    // ---- Calendar view maps (filter reactive) ----
    const maps = buildDailyTradeMaps(GLOBAL.filteredTrades);
    const pnlMap = buildDailyPnLMap(GLOBAL.dailyAgg || []);
    const dailyRMap = buildDailyRMap(GLOBAL.dailyAgg || []);

    let cum = 0;
    const cumRByDate = new Map();
    for(const d of GLOBAL.viewSpine){
      const r = dailyRMap.get(d) || 0;
      cum += r;
      cumRByDate.set(d, cum);
    }

    GLOBAL._calMaps = {
      tradeCount: maps.count,
      dailyPnL: pnlMap,
      dailyR: dailyRMap,
      cumRByDate
    };

    GLOBAL.score = computeScore(GLOBAL.filteredTrades, GLOBAL.tradeKPIs);


    console.log("[ANALYSIS] filteredTrades:", GLOBAL.filteredTrades.length);
    console.log("[ANALYSIS] tradeKPIs:", GLOBAL.tradeKPIs);
    console.log("[ANALYSIS] score:", GLOBAL.score);
  }

  // ---- Date spine helpers ----
  function parseISO(s){ // YYYY-MM-DD
    const [y,m,d] = String(s).split("-").map(Number);
    return new Date(Date.UTC(y, (m||1)-1, d||1));
  }
  function isoFromDate(dt){
    const y = dt.getUTCFullYear();
    const m = String(dt.getUTCMonth()+1).padStart(2,"0");
    const d = String(dt.getUTCDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }
  function addDays(dt, n){
    const x = new Date(dt.getTime());
    x.setUTCDate(x.getUTCDate() + n);
    return x;
  }
  const MONTHS_DE = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const DOW_DE = ["Mo","Di","Mi","Do","Fr"];

  function monthKeyFromISO(iso){ return String(iso).slice(0,7); } // "YYYY-MM"
  function monthLabelFromKey(key){
    const y = Number(key.slice(0,4));
    const m = Number(key.slice(5,7));
    const mon = MONTHS_DE[(m-1) || 0] || key;
    return `${mon} ${y}`;
  }
  function firstDayOfMonthUTC(key){
    const y = Number(key.slice(0,4));
    const m = Number(key.slice(5,7));
    return new Date(Date.UTC(y, (m||1)-1, 1));
  }
  function daysInMonthUTC(key){
    const y = Number(key.slice(0,4));
    const m = Number(key.slice(5,7));
    const last = new Date(Date.UTC(y, (m||1), 0));
    return last.getUTCDate();
  }
  function addMonthsKey(key, delta){
    const y = Number(key.slice(0,4));
    const m = Number(key.slice(5,7));
    const dt = new Date(Date.UTC(y, (m-1), 1));
    dt.setUTCMonth(dt.getUTCMonth() + delta);
    const yy = dt.getUTCFullYear();
    const mm = String(dt.getUTCMonth()+1).padStart(2,"0");
    return `${yy}-${mm}`;
  }

  function computeAllowedMonths(dateStart, dateEnd, spine){
    const s = dateStart || (spine?.[0] ?? null);
    const e = dateEnd   || (spine?.at?.(-1) ?? null);
    if(!s || !e) return [];

    const out = [];
    let cur = monthKeyFromISO(s);
    const last = monthKeyFromISO(e);
    while(cur <= last){
      out.push(cur);
      cur = addMonthsKey(cur, 1);
    }
    return out;
  }

  function buildDailyTradeMaps(trades){
    const count = new Map(); // date -> n trades
    const sumR = new Map();  // date -> daily sum R
    for(const tr of (trades || [])){
      const d = tr?.trade_date || tr?.date;
      if(!d) continue;
      const r = Number(tr?.result_r ?? tr?.r ?? 0);
      if(!Number.isFinite(r)) continue;
      count.set(d, (count.get(d) || 0) + 1);
      sumR.set(d, (sumR.get(d) || 0) + r);
    }
    return { count, sumR };
  }

  function buildDailyRMap(dailyAggRows){
    const map = new Map();
    for(const row of (dailyAggRows || [])){
      if(row?.date && Number.isFinite(row.daily_R)){
        map.set(row.date, Number(row.daily_R));
      }
    }
    return map;
  }

  function buildDailyPnLMap(dailyAggRows){
    const map = new Map();
    for(const row of (dailyAggRows || [])){
      const d = row?.date;
      if(!d) continue;
      const pnl = (row.daily_pnl_$ ?? row.daily_pnl ?? row.dailyPnl ?? row.pnl ?? row.dailyPnL ?? null);
      if(pnl === null || pnl === undefined) continue;
      const x = Number(pnl);
      if(!Number.isFinite(x)) continue;
      map.set(d, x);
    }
    return map;
  }

  function buildCumRByDateOnView(viewSpine, dailySumRMap){
    let cum = 0;
    const out = new Map(); // date -> cumR at end of day
    for(const d of (viewSpine || [])){
      const r = Number(dailySumRMap.get(d) || 0);
      cum += (Number.isFinite(r) ? r : 0);
      out.set(d, cum);
    }
    return out;
  }

  function badgeClassFromValue(v){
    const x = Number(v);
    if(!Number.isFinite(x) || x === 0) return "";
    return x > 0 ? "good" : "bad";

    const mon = MONTHS_DE[dt.getUTCMonth()];

  function buildCalendarSpine(equityRows, dailyAggRows, startingEquity){
    const equityMap = new Map(); // date -> cash_equity_$
    for(const r of (equityRows||[])){
      if(r?.date) equityMap.set(r.date, Number(r.cash_equity_$));
    }

    const rMap = new Map(); // date -> daily_R
    for(const r of (dailyAggRows||[])){
      if(r?.date) rMap.set(r.date, Number(r.daily_R ?? 0));
    }

    const allDates = [];
    const datesSource = [
      ...(equityRows||[]).map(x=>x.date).filter(Boolean),
      ...(dailyAggRows||[]).map(x=>x.date).filter(Boolean),
    ];
    if(!datesSource.length){
      return { spine: [], seriesEquity: [], seriesCumR: [], seriesDailyR: [] };
    }

    const minIso = datesSource.reduce((a,b)=> a < b ? a : b);
    const maxIso = datesSource.reduce((a,b)=> a > b ? a : b);

    // today (local) as ISO YYYY-MM-DD
    const todayIso = (() => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    })();

    // spine ends at today if today is later than last data point
    const endIso = (todayIso > maxIso) ? todayIso : maxIso;

    let cur = parseISO(minIso);
    const end = parseISO(endIso);


    // carry-forward equity (start from startingEquity until first known)
    let lastEquity = Number.isFinite(Number(startingEquity)) ? Number(startingEquity) : null;
    let cumR = 0;

    while(cur <= end){
      const iso = isoFromDate(cur);
      allDates.push(iso);

      if(equityMap.has(iso)){
        const v = equityMap.get(iso);
        if(Number.isFinite(v)) lastEquity = v;
      }
      const dailyR = rMap.has(iso) ? (Number(rMap.get(iso)) || 0) : 0;
      cumR += dailyR;

      cur = addDays(cur, 1);
    }

    // Build series aligned to allDates
    const seriesEquity = [];
    const seriesDailyR = [];
    const seriesCumR = [];
    lastEquity = Number.isFinite(Number(startingEquity)) ? Number(startingEquity) : null;
    cumR = 0;

    for(const iso of allDates){
      if(equityMap.has(iso)){
        const v = equityMap.get(iso);
        if(Number.isFinite(v)) lastEquity = v;
      }
      seriesEquity.push(lastEquity);

      const dailyR = rMap.has(iso) ? (Number(rMap.get(iso)) || 0) : 0;
      seriesDailyR.push(dailyR);

      cumR += dailyR;
      seriesCumR.push(cumR);
    }

    return { spine: allDates, seriesEquity, seriesCumR, seriesDailyR };
  }

    function drawStreakBarChart(canvas, labels, wins, losses, opts){
      const ctx = canvas.getContext("2d");

      // size
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);

      const W = rect.width;
      const H = rect.height;

      ctx.clearRect(0,0,W,H);

      // padding
      const padL = 46;
      const padR = 12;
      const padT = 14;
      const padB = 28;

      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      // determine y range (sym around 0 for nice look)
      let maxAbs = 1;
      for(let i=0;i<(labels||[]).length;i++){
        const w = Math.abs(Number(wins?.[i] || 0));
        const l = Math.abs(Number(losses?.[i] || 0));
        if(w > maxAbs) maxAbs = w;
        if(l > maxAbs) maxAbs = l;
      }

      const yMax = maxAbs;
      const yMin = -maxAbs;

      const xCount = (labels || []).length;
      const step = xCount ? (plotW / xCount) : plotW;
      const barW = Math.max(12, Math.min(step * 0.92, 90));

      const xToPx = (i) => padL + i * step + step/2;
      const yToPx = (v) => {
        const t = (v - yMin) / (yMax - yMin);
      return padT + (1 - t) * plotH;
      };

      // axes: zero line
      const y0 = yToPx(0);
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = "rgba(255,255,255,.20)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, y0);
      ctx.lineTo(padL + plotW, y0);
      ctx.stroke();

      // y ticks (3 lines: -max, 0, +max)
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "rgba(255,255,255,.65)";
      ctx.font = "12px ui-sans-serif, system-ui";
      const fmtY = opts?.yFmt || ((n)=> String(n));
      const yTicks = [yMax, 0, yMin];
      for(const yt of yTicks){
        const py = yToPx(yt);
        ctx.globalAlpha = 0.28;
        ctx.strokeStyle = "rgba(255,255,255,.14)";
        ctx.beginPath();
        ctx.moveTo(padL, py);
        ctx.lineTo(padL + plotW, py);
        ctx.stroke();

        ctx.globalAlpha = 0.85;
        ctx.fillText(fmtY(yt), 8, py + 4);
      }

      // bars
      for(let i=0;i<xCount;i++){
        const w = Number(wins?.[i] || 0);      // >= 0
        const l = Number(losses?.[i] || 0);    // >= 0 (we'll draw negative)

        const cx = xToPx(i);
        const x0 = cx - barW/2;

        // Win bar (up)
        if(w > 0){
          const yA = yToPx(0);
          const yB = yToPx(w);
          const top = Math.min(yA, yB);
          const h = Math.abs(yB - yA);
          ctx.fillStyle = "rgba(53,208,127,.75)";
          ctx.fillRect(x0, top, barW, Math.max(1, h));
        }

        // Loss bar (down)
        if(l > 0){
          const yA = yToPx(0);
          const yB = yToPx(-l);
          const top = Math.min(yA, yB);
          const h = Math.abs(yB - yA);
          ctx.fillStyle = "rgba(255,77,109,.75)";
          ctx.fillRect(x0, top, barW, Math.max(1, h));
        }

        // x label
        ctx.globalAlpha = 0.80;
        ctx.fillStyle = "rgba(255,255,255,.60)";
        ctx.font = "12px ui-sans-serif, system-ui";
        ctx.textAlign = "center";
        ctx.fillText(String(labels[i]), cx, H - 10);
        ctx.textAlign = "left";
      }


      // tooltip hitboxes
      drawStreakBarChart._hit = { padL, padT, plotW, plotH, step, barW, xToPx, y0, labels, wins, losses };
   }

  
  function drawLineChart(canvas, spine, values, opts){
    const ctx = canvas.getContext("2d");
    const wrap = $("chartWrap");
    const tooltip = $("tooltip");

    const DPR = Math.max(1, Math.floor(window.devicePixelRatio || 1));
    const cssW = wrap.clientWidth;
    const cssH = canvas.clientHeight; // from CSS (height:360px)
    canvas.width = cssW * DPR;
    canvas.height = cssH * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);

    ctx.clearRect(0,0,cssW,cssH);

    // chart area padding
    const padL = 56, padR = 16, padT = 16, padB = 40;
    const W = cssW - padL - padR;
    const H = cssH - padT - padB;

    // compute min/max ignoring nulls
    const clean = values.filter(v => Number.isFinite(Number(v)));
    let minV = clean.length ? Math.min(...clean) : 0;
    let maxV = clean.length ? Math.max(...clean) : 1;
    if(minV === maxV){
      // flat line padding
      minV -= 1;
      maxV += 1;
    } else {
      const pad = (maxV - minV) * 0.08;
      minV -= pad;
      maxV += pad;
    }

    const xFor = (i) => padL + (i/(spine.length-1 || 1)) * W;
    const yFor = (v) => padT + (1 - ((v - minV)/(maxV - minV))) * H;

    // grid + y labels (4 lines)
    ctx.strokeStyle = "rgba(120,160,255,.10)";
    ctx.lineWidth = 1;

    const yTicks = 4;
    ctx.font = "12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial";
    ctx.fillStyle = "rgba(138,164,214,.95)";

    for(let k=0;k<=yTicks;k++){
      const t = k / yTicks;
      const y = padT + t * H;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL+W, y);
      ctx.stroke();

      const val = maxV - t*(maxV-minV);
      const label = opts.yFmt(val);
      ctx.fillText(label, 10, y + 4);
    }

    // x ticks at 1st and 15th
    ctx.fillStyle = "rgba(138,164,214,.95)";
    ctx.strokeStyle = "rgba(120,160,255,.12)";

    for(let i=0;i<spine.length;i++){
      const iso = spine[i];
      const dt = parseISO(iso);
      const day = dt.getUTCDate();
      if(day !== 1 && day !== 15) continue;

      const x = xFor(i);
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT+H);
      ctx.stroke();

      const lab = labelForTick(iso);
      if(lab){
        ctx.fillText(lab, x - 12, padT + H + 22);
      }
    }

    // line (Ice glow)
    const grad = ctx.createLinearGradient(0, padT, 0, padT + H);
    grad.addColorStop(0, "rgba(41,182,255,.95)");
    grad.addColorStop(1, "rgba(45,107,255,.92)");

    // build path once
    ctx.beginPath();
    let first = true;
    for(let i=0;i<spine.length;i++){
      const v = values[i];
      if(!Number.isFinite(Number(v))) continue;
      const x = xFor(i);
      const y = yFor(Number(v));
      if(first){ ctx.moveTo(x,y); first = false; }
      else { ctx.lineTo(x,y); }
    }

    // glow pass
    ctx.save();
    ctx.strokeStyle = grad;
    ctx.lineWidth = 6;
    ctx.globalAlpha = 0.22;
    ctx.shadowBlur = 18;
    ctx.shadowColor = "rgba(41,182,255,.65)";
    ctx.stroke();
    ctx.restore();

    // main stroke
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.25;
    ctx.globalAlpha = 0.98;
    ctx.stroke();
// hover interaction
    let hoverIndex = null;

    function showAt(clientX, clientY){
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      // clamp into plot area
      const clampedX = Math.min(padL+W, Math.max(padL, x));
      const t = (clampedX - padL) / (W || 1);
      const idx = Math.round(t * (spine.length-1));
      hoverIndex = Math.min(spine.length-1, Math.max(0, idx));

      const vx = xFor(hoverIndex);
      const vv = values[hoverIndex];
      const vy = Number.isFinite(Number(vv)) ? yFor(Number(vv)) : (padT+H);

      // crosshair
      drawLineChart._lastCrosshair = { vx, vy, vv, iso: spine[hoverIndex] };

      // tooltip
      const dateLabel = spine[hoverIndex];
      tooltip.innerHTML = `
        <div><b>${opts.title}</b>: ${opts.vFmt(vv)}</div>
        <div class="muted">${dateLabel}</div>
      `;
      tooltip.style.left = `${vx}px`;
      tooltip.style.top = `${vy}px`;
      tooltip.style.display = "block";

      // redraw with crosshair
      redrawWithCrosshair();
    }


    function hide(){
      tooltip.style.display = "none";
      hoverIndex = null;
      drawLineChart._lastCrosshair = null;
      // redraw without crosshair
      redrawNoCrosshair();
    }

    function redrawNoCrosshair(){
      // re-draw quickly by calling itself (cheap enough for our data sizes)
      // but avoid re-binding events: just call drawLineChartCore-like behavior by re-invoking drawLineChart
      // We'll instead draw crosshair as overlay in-place:
      // easiest: just call drawLineChart with a flag off — but we are inside it.
      // So: simply clear tooltip/crosshair and redraw from scratch using stored opts.
      // (We rely on outer caller to redraw; for now do a fast full redraw.)
      // To keep it simple, the outer code calls render() on toggle/resize.
      // Here we draw crosshair overlay only; to remove, just re-render via opts.onRequestRender if present.
      if(opts.onRequestRender) opts.onRequestRender();
    }

    function redrawWithCrosshair(){
      if(opts.onRequestRender) opts.onRequestRender(true);
    }

    // Bind events (remove previous by replacing handlers)
    canvas.onmousemove = (e) => showAt(e.clientX, e.clientY);
    canvas.onmouseleave = hide;

    canvas.ontouchstart = (e) => {
      if(e.touches && e.touches[0]){
        showAt(e.touches[0].clientX, e.touches[0].clientY);
      }
    };
    canvas.ontouchmove = (e) => {
      if(e.touches && e.touches[0]){
        showAt(e.touches[0].clientX, e.touches[0].clientY);
      }
    };
    canvas.ontouchend = hide;

    // draw crosshair if requested by external re-render
    function drawCrosshair(){
      const c = drawLineChart._lastCrosshair;
      if(!c) return;
      ctx.strokeStyle = "rgba(231,240,255,.28)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(c.vx, padT);
      ctx.lineTo(c.vx, padT+H);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(c.vx, c.vy, 3.5, 0, Math.PI*2);
      ctx.fillStyle = "rgba(207,232,255,.98)";
      ctx.fill();
    }

    // Expose overlay draw function and bounds so caller can re-render with crosshair
    drawLineChart._overlay = { drawCrosshair };
    drawLineChart._state = { spine, values, opts };
  }

      const risk = Math.abs(Number(latest?.effective_risk_$ ?? 0));

      const _sub=$("subtitle"); if(_sub) _sub.textContent="";

      $("dataOk").textContent = "DATA: OK";
      $("dataOk").style.background = "rgba(53,208,127,.12)";
      $("dataOk").style.borderColor = "rgba(53,208,127,.25)";
      $("dataOk").style.color = "#bff2d9";

      // renderCards(latest, meta);
      renderKpiPanel(latest);

      // Build calendar spine (ALL days) + series
      const startingEquity = Number(kpis?.starting_equity_$ ?? (equity?.[0]?.equity_start_$ ?? null));
      const { spine, seriesEquity, seriesCumR, seriesDailyR } = buildCalendarSpine(equity, dailyAgg, startingEquity);
      GLOBAL.spine = spine;
      GLOBAL.seriesEquity = seriesEquity;
      GLOBAL.seriesCumR = seriesCumR;
      GLOBAL.seriesDailyR = seriesDailyR;
      
      // JETZT: spine existiert -> filter-derived series (CumR_F) korrekt berechnen
      recomputeAnalysis();

      // Calendar nav wiring (once)
      const prevBtn = $("calPrev");
      const nextBtn = $("calNext");
      if(prevBtn && !prevBtn._bound){
        prevBtn._bound = true;
        prevBtn.addEventListener("click", () => {
          const months = GLOBAL.calendar?.allowedMonths || [];
          const idx = months.indexOf(GLOBAL.calendar?.month);
          if(idx > 0){
            GLOBAL.calendar.month = months[idx-1];
            renderCalendar();
          }
        });
      }
      if(nextBtn && !nextBtn._bound){
        nextBtn._bound = true;
        nextBtn.addEventListener("click", () => {
          const months = GLOBAL.calendar?.allowedMonths || [];
          const idx = months.indexOf(GLOBAL.calendar?.month);
          if(idx >= 0 && idx < months.length-1){
            GLOBAL.calendar.month = months[idx+1];
            renderCalendar();
          }
        });
      }

      renderKpiPanel(latest);
      renderCurve();
renderDebug();

    } catch(err){
      const sub = $("subtitle");
      if(sub) sub.textContent = "";
      const ok = $("dataOk");
      if(ok){
        ok.textContent = "DATA: ERROR";
        ok.style.background = "rgba(255,77,109,.12)";
        ok.style.borderColor = "rgba(255,77,109,.25)";
        ok.style.color = "#ffd1db";
      }
      const dbg = $("debug");
      if(dbg) dbg.textContent = String(err);
      console.error(err);
    }
  }

  // Toggle wiring
  $("btnEquity").addEventListener("click", () => {
    GLOBAL.mode = "equity";
    $("btnEquity").classList.add("active");
    $("btnR").classList.remove("active");
    $("btnDD").classList.remove("active");
    $("btnStreaks").classList.remove("active");
    $("btnCal").classList.remove("active");
renderCurve();
  });
  $("btnR").addEventListener("click", () => {
    GLOBAL.mode = "r";
    $("btnR").classList.add("active");
    $("btnEquity").classList.remove("active");
    $("btnDD").classList.remove("active");
    $("btnStreaks").classList.remove("active");
    $("btnCal").classList.remove("active");
renderCurve();
  });
  $("btnDD").addEventListener("click", () => {
    GLOBAL.mode = "dd";
    $("btnDD").classList.add("active");
    $("btnEquity").classList.remove("active");
    $("btnR").classList.remove("active");
    $("btnStreaks").classList.remove("active");
    $("btnCal").classList.remove("active");
renderCurve();
  });
  $("btnStreaks").addEventListener("click", () => {
    GLOBAL.mode = "streaks";
    $("btnStreaks").classList.add("active");
    $("btnEquity").classList.remove("active");
    $("btnR").classList.remove("active");
    $("btnDD").classList.remove("active");
    $("btnCal").classList.remove("active");
renderCurve();
  });

  $("btnCal").addEventListener("click", () => {
    GLOBAL.mode = "calendar";
    $("btnCal").classList.add("active");
    $("btnEquity").classList.remove("active");
    $("btnR").classList.remove("active");
    $("btnDD").classList.remove("active");
    $("btnStreaks").classList.remove("active");
    renderCurve();
  });


  // Redraw on resize (debounced)
  let _t = null;
  window.addEventListener("resize", () => {
    clearTimeout(_t);
    _t = setTimeout(() => renderCurve(), 150);
  });

  main();
</script>

</div>
</body>
</html>
