<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Trade Entry</title>
  <style>
    :root{
      --bg0:#060B18;
      --bg1:#0A1226;
      --card:#0D1731;
      --card2:#0B142B;
      --line:rgba(255,255,255,.08);
      --text:#EAF1FF;
      --muted:rgba(234,241,255,.7);
      --muted2:rgba(234,241,255,.55);
      --blue:#2F66FF;
      --good:#3ddc84;
      --bad:#ff5a7a;
      --warn:#ffb020;
      --radius:16px;
      --radius2:14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 900px at 10% -10%, rgba(47,102,255,.22) 0%, rgba(47,102,255,0) 55%),
        radial-gradient(900px 700px at 95% 0%, rgba(47,102,255,.18) 0%, rgba(47,102,255,0) 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
    }

    .shell{ max-width: 520px; margin: 0 auto; }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 10px 6px 14px;
    }
    .brand{ display:flex; flex-direction:column; gap:4px; }
    .brand h1{ font-size: 20px; margin:0; font-weight: 750; }
    .brand .sub{ font-size: 12px; color: var(--muted2); }
    .link{
      color: rgba(170,200,255,.9);
      text-decoration:none;
      font-weight:650;
      font-size: 13px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.03);
    }
    .link:active{transform: translateY(1px);}

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 16px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
    }

    .tabs{
      display:flex;
      gap:10px;
      padding: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--line);
      margin-bottom: 14px;
    }
    .tabbtn{
      flex:1;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 750;
      cursor:pointer;
      letter-spacing:.2px;
    }
    .tabbtn.active{
      color: var(--text);
      background: linear-gradient(180deg, rgba(47,102,255,.35), rgba(47,102,255,.18));
      border-color: rgba(120,170,255,.35);
      box-shadow: 0 10px 30px rgba(47,102,255,.16);
    }

    .panel{display:none;}
    .panel.active{display:block;}

    label{
      display:block;
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 8px 2px;
      font-weight: 650;
    }

    input, select, button, textarea{ font: inherit; color: var(--text); }

    .input{
      width:100%;
      padding: 14px 14px;
      border-radius: var(--radius2);
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(6,11,24,.55);
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
    }
    .input:focus{
      border-color: rgba(120,170,255,.55);
      box-shadow: 0 0 0 4px rgba(47,102,255,.18);
    }

    .row{ margin: 14px 0; }

    /* Segmented control */
    .seg{
      display:flex;
      gap:8px;
      padding: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--line);
    }
    .seg input{ display:none; }
    .seg label{
      margin:0;
      flex:1;
      text-align:center;
      padding: 10px 10px;
      border-radius: 999px;
      font-weight: 750;
      color: var(--muted);
      cursor:pointer;
      user-select:none;
      border: 1px solid transparent;
    }
    .seg input:checked + label{
      color: var(--text);
      background: linear-gradient(180deg, rgba(47,102,255,.33), rgba(47,102,255,.14));
      border-color: rgba(120,170,255,.35);
      box-shadow: 0 10px 26px rgba(47,102,255,.12);
    }

    /* Instrument buttons */
    .instGrid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:10px;
    }
    .instbtn{
      padding: 12px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(6,11,24,.55);
      cursor:pointer;
      font-weight: 800;
      letter-spacing:.3px;
    }
    .instbtn.active{
      border-color: rgba(120,170,255,.55);
      background: linear-gradient(180deg, rgba(47,102,255,.28), rgba(47,102,255,.10));
      box-shadow: 0 0 0 4px rgba(47,102,255,.14);
    }
    .instbtn:active{ transform: translateY(1px); }

    .actions{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin-top: 6px;
    }
    .btn{
      padding: 14px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      cursor:pointer;
      font-weight: 850;
      letter-spacing:.2px;
      background: rgba(255,255,255,.04);
    }
    .btnPrimary{
      background: linear-gradient(180deg, rgba(47,102,255,.85), rgba(28,75,219,.85));
      border-color: rgba(120,170,255,.35);
      box-shadow: 0 18px 40px rgba(47,102,255,.18);
    }
    .btn:active{ transform: translateY(1px); }

    .optionalLink{
      display:inline-block;
      margin-top: 10px;
      font-size: 12px;
      color: rgba(170,200,255,.9);
      cursor:pointer;
      text-decoration:none;
      font-weight: 750;
      opacity: .9;
    }
    .optionalBlock{
      margin-top: 12px;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px dashed rgba(255,255,255,.12);
      background: rgba(255,255,255,.02);
      display:none;
    }

    /* STATUS: larger font for "Gesendet" lines */
    .status{
      margin-top: 12px;
      font-size: 15px; /* bigger as requested */
      font-weight: 800;
      color: var(--muted);
    }
    .ok{ color: var(--good); }
    .warn{ color: var(--warn); }

    /* Square +/- toggle button */
    .signRow{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .signBtn{
      width: 52px;
      min-width: 52px;
      height: 52px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(6,11,24,.55);
      cursor:pointer;
      font-weight: 950;
      font-size: 22px;
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }
    .signBtn.plus.active{
      border-color: rgba(61,220,132,.6);
      box-shadow: 0 0 0 4px rgba(61,220,132,.14);
      background: linear-gradient(180deg, rgba(61,220,132,.22), rgba(6,11,24,.55));
      color: var(--good);
    }
    .signBtn.minus.active{
      border-color: rgba(255,90,122,.6);
      box-shadow: 0 0 0 4px rgba(255,90,122,.14);
      background: linear-gradient(180deg, rgba(255,90,122,.22), rgba(6,11,24,.55));
      color: var(--bad);
    }

    iframe{ display:none; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <h1>Trade Tracker</h1>
        <div class="sub">Quick Entry (mobile)</div>
      </div>
      <a class="link" href="../index.html">View Dashboard</a>
    </div>

    <iframe name="hidden_iframe"></iframe>

    <div class="card">
      <div class="tabs">
        <button class="tabbtn active" type="button" data-tab="trade">Trade Entry</button>
        <button class="tabbtn" type="button" data-tab="adj">Daily P/L</button>
      </div>

      <!-- ===================== TRADE PANEL ===================== -->
      <section id="panel-trade" class="panel active">
        <form id="tradeForm" method="POST"
          action="https://script.google.com/macros/s/AKfycbwQtw3cjS5mvz82z3D86qe8ESYr-_vFH3CE0xQuEfVxi2rwrDbQFMqy6-E-lMtjX9zteA/exec"
          target="hidden_iframe">

          <input type="hidden" name="type" value="trade" />
          <input type="hidden" name="trade_id" id="trade_id" />
          <input type="hidden" name="date" id="trade_date" />
          <input type="hidden" name="instrument" id="trade_instrument" />
          <input type="hidden" name="include" id="trade_include" value="TRUE" />
          <input type="hidden" name="result_r" id="trade_result_r" />

          <div class="row">
            <label>Date</label>
            <div class="seg" role="tablist" aria-label="Date selection">
              <input id="t_today" type="radio" name="tradeDateMode" value="today" checked>
              <label for="t_today">today</label>

              <input id="t_yday" type="radio" name="tradeDateMode" value="yesterday">
              <label for="t_yday">yesterday</label>

              <input id="t_custom" type="radio" name="tradeDateMode" value="custom">
              <label for="t_custom">date</label>
            </div>

            <div id="tradeCustomDateWrap" style="display:none; margin-top:10px;">
              <input class="input" type="date" id="tradeCustomDate" />
            </div>
          </div>

          <div class="row">
            <label>Instrument</label>
            <div class="instGrid" id="instButtons">
              <button type="button" class="instbtn active" data-inst="ES">ES</button>
              <button type="button" class="instbtn" data-inst="NQ">NQ</button>
              <button type="button" class="instbtn" data-inst="RTY">RTY</button>
              <button type="button" class="instbtn" data-inst="YM">YM</button>
              <button type="button" class="instbtn" data-inst="CL">CL</button>
              <button type="button" class="instbtn" data-inst="GC">GC</button>
            </div>
          </div>

          <div class="row">
            <label>Result (R)</label>
            <div class="signRow">
              <button type="button" id="tradeSignBtn" class="signBtn plus active">+</button>
              <input class="input" id="tradeResultR" inputmode="decimal" style="text-align:center;" />
            </div>
          </div>

          <div class="actions">
            <button class="btn btnPrimary" type="submit">Save</button>
            <button class="btn" type="button" id="tradeClear">Clear</button>
          </div>

          <a class="optionalLink" id="tradeOptionalToggle">Optional</a>

          <div class="optionalBlock" id="tradeOptionalBlock">
            <div class="row" style="margin-top:0;">
              <label>Notes</label>
              <input class="input" name="notes" id="tradeNotes" placeholder="optional" />
            </div>
            <div class="row" style="margin-bottom:0;">
              <label>Include</label>
              <select class="input" id="tradeIncludeSelect">
                <option value="TRUE" selected>TRUE</option>
                <option value="FALSE">FALSE</option>
              </select>
            </div>
          </div>

          <div id="tradeStatus" class="status"></div>
        </form>
      </section>

      <!-- ===================== ADJUSTMENT PANEL ===================== -->
      <section id="panel-adj" class="panel">
        <form id="adjForm" method="POST"
          action="https://script.google.com/macros/s/AKfycbwQtw3cjS5mvz82z3D86qe8ESYr-_vFH3CE0xQuEfVxi2rwrDbQFMqy6-E-lMtjX9zteA/exec"
          target="hidden_iframe">

          <input type="hidden" name="type" value="adjustment" />
          <input type="hidden" name="event_id" id="adj_event_id" />
          <input type="hidden" name="date" id="adj_date" />
          <input type="hidden" name="include" id="adj_include" value="TRUE" />
          <input type="hidden" name="amount_$" id="adj_amount_usd" />

          <div class="row">
            <label>Date</label>
            <div class="seg" role="tablist" aria-label="Date selection">
              <input id="a_today" type="radio" name="adjDateMode" value="today">
              <label for="a_today">today</label>

              <input id="a_yday" type="radio" name="adjDateMode" value="yesterday" checked>
              <label for="a_yday">yesterday</label>

              <input id="a_custom" type="radio" name="adjDateMode" value="custom">
              <label for="a_custom">date</label>
            </div>

            <div id="adjCustomDateWrap" style="display:none; margin-top:10px;">
              <input class="input" type="date" id="adjCustomDate" />
            </div>
          </div>

          <div class="row">
            <label>Type</label>
            <select class="input" id="adjTypeSelect" name="adj_type">
              <option value="daily_pnl" selected>daily_pnl</option>
              <option value="withdrawal">withdrawal</option>
              <option value="deposit">deposit</option>
              <option value="fees">fees</option>
              <option value="correction">correction</option>
            </select>
          </div>

          <div class="row">
            <label>Amount ($)</label>
            <div class="signRow">
              <button type="button" id="adjSignBtn" class="signBtn plus active">+</button>
              <input class="input" id="adjAmount" inputmode="decimal" style="text-align:center;" />
            </div>
          </div>

          <div class="actions">
            <button class="btn btnPrimary" type="submit">Save</button>
            <button class="btn" type="button" id="adjClear">Clear</button>
          </div>

          <a class="optionalLink" id="adjOptionalToggle">Optional</a>

          <div class="optionalBlock" id="adjOptionalBlock">
            <div class="row" style="margin-top:0;">
              <label>Notes</label>
              <input class="input" name="notes" id="adjNotes" placeholder="optional" />
            </div>
            <div class="row" style="margin-bottom:0;">
              <label>Include</label>
              <select class="input" id="adjIncludeSelect">
                <option value="TRUE" selected>TRUE</option>
                <option value="FALSE">FALSE</option>
              </select>
            </div>
          </div>

          <div id="adjStatus" class="status"></div>
        </form>
      </section>
    </div>
  </div>

<script>
  // --- Utility functions ---
  function pad2(n){ return String(n).padStart(2,"0"); }

  function formatDDMMYYYY(d){
    const dd = pad2(d.getDate());
    const mm = pad2(d.getMonth()+1);
    const yy = d.getFullYear();
    return `${dd}.${mm}.${yy}`;
  }

  function dateFromMode(mode, customDateInput){
    const now = new Date();
    if (mode === "today") return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (mode === "yesterday") {
      const y = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      y.setDate(y.getDate() - 1);
      return y;
    }
    if (mode === "custom") {
      const v = customDateInput.value;
      if (!v) return null;
      const [yyyy, mm, dd] = v.split("-").map(Number);
      return new Date(yyyy, mm-1, dd);
    }
    return null;
  }

  function makeId(prefix){
    const d = new Date();
    const ts = `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
    const rnd = Math.floor(1000 + Math.random()*9000);
    return `${prefix}-${ts}-${rnd}`;
  }

  function setStatus(el, msg, cls){
    el.className = `status ${cls || ""}`;
    el.textContent = msg;
  }

  // --- Tabs ---
  const tabButtons = document.querySelectorAll(".tabbtn");
  const tradePanel = document.getElementById("panel-trade");
  const adjPanel = document.getElementById("panel-adj");

  tabButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      tabButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const t = btn.dataset.tab;
      tradePanel.classList.toggle("active", t === "trade");
      adjPanel.classList.toggle("active", t === "adj");
    });
  });

  // --- Optional toggles ---
  const tradeOptToggle = document.getElementById("tradeOptionalToggle");
  const tradeOptBlock = document.getElementById("tradeOptionalBlock");
  tradeOptToggle.addEventListener("click", () => {
    const open = tradeOptBlock.style.display === "block";
    tradeOptBlock.style.display = open ? "none" : "block";
  });

  const adjOptToggle = document.getElementById("adjOptionalToggle");
  const adjOptBlock = document.getElementById("adjOptionalBlock");
  adjOptToggle.addEventListener("click", () => {
    const open = adjOptBlock.style.display === "block";
    adjOptBlock.style.display = open ? "none" : "block";
  });

  // --- Date mode show/hide custom date ---
  const tradeCustomWrap = document.getElementById("tradeCustomDateWrap");
  document.querySelectorAll('input[name="tradeDateMode"]').forEach(r => {
    r.addEventListener("change", () => {
      const checked = document.querySelector('input[name="tradeDateMode"]:checked').value;
      tradeCustomWrap.style.display = (checked === "custom") ? "block" : "none";
    });
  });

  const adjCustomWrap = document.getElementById("adjCustomDateWrap");
  document.querySelectorAll('input[name="adjDateMode"]').forEach(r => {
    r.addEventListener("change", () => {
      const checked = document.querySelector('input[name="adjDateMode"]:checked').value;
      adjCustomWrap.style.display = (checked === "custom") ? "block" : "none";
    });
  });

  // --- Instrument buttons only ---
  const instBtns = document.querySelectorAll(".instbtn");
  let selectedInst = "ES";

  function setInstrument(inst){
    selectedInst = inst;
    instBtns.forEach(b => b.classList.toggle("active", b.dataset.inst === inst));
  }
  instBtns.forEach(b => b.addEventListener("click", () => setInstrument(b.dataset.inst)));
  setInstrument("ES");

  // --- Sign toggles (Trade & Adj) ---
  let tradeSign = 1; // +1 or -1
  const tradeSignBtn = document.getElementById("tradeSignBtn");
  tradeSignBtn.addEventListener("click", () => {
    tradeSign = tradeSign === 1 ? -1 : 1;
    if (tradeSign === 1) {
      tradeSignBtn.textContent = "+";
      tradeSignBtn.classList.add("plus","active");
      tradeSignBtn.classList.remove("minus");
    } else {
      tradeSignBtn.textContent = "−";
      tradeSignBtn.classList.add("minus","active");
      tradeSignBtn.classList.remove("plus");
    }
  });

  let adjSign = 1;
  const adjSignBtn = document.getElementById("adjSignBtn");
  adjSignBtn.addEventListener("click", () => {
    adjSign = adjSign === 1 ? -1 : 1;
    if (adjSign === 1) {
      adjSignBtn.textContent = "+";
      adjSignBtn.classList.add("plus","active");
      adjSignBtn.classList.remove("minus");
    } else {
      adjSignBtn.textContent = "−";
      adjSignBtn.classList.add("minus","active");
      adjSignBtn.classList.remove("plus");
    }
  });

  // Initialize button classes correctly
  tradeSignBtn.classList.add("plus","active");
  adjSignBtn.classList.add("plus","active");

  // --- Trade submit ---
  const tradeForm = document.getElementById("tradeForm");
  const tradeStatus = document.getElementById("tradeStatus");

  tradeForm.addEventListener("submit", (ev) => {
    ev.preventDefault(); // IMPORTANT: stop browser navigation

    const mode = document.querySelector('input[name="tradeDateMode"]:checked').value;
    const custom = document.getElementById("tradeCustomDate");
    const d = dateFromMode(mode, custom);
    if (!d) {
      setStatus(tradeStatus, "Bitte Datum auswählen (bei 'date').", "warn");
      return;
    }

    if (!selectedInst) {
      setStatus(tradeStatus, "Bitte Instrument wählen.", "warn");
      return;
    }

    const rStr = document.getElementById("tradeResultR").value.trim();
    if (!rStr) {
      setStatus(tradeStatus, "Bitte Result (R) eingeben.", "warn");
      return;
    }

    // normalize German comma
    const normalizedR = rStr.replace(",", ".").replace(/\s+/g, "");
    const rValue = Number(normalizedR);
    if (!Number.isFinite(rValue)) {
      setStatus(tradeStatus, "Ungültige Zahl.", "warn");
      return;
    }

    const signedR = rValue * tradeSign;

    // hidden fields
    document.getElementById("trade_id").value = makeId("T");
    document.getElementById("trade_date").value = formatDDMMYYYY(d);
    document.getElementById("trade_instrument").value = selectedInst;
    document.getElementById("trade_result_r").value = signedR.toFixed(2);

    const incSel = document.getElementById("tradeIncludeSelect");
    document.getElementById("trade_include").value = incSel ? incSel.value : "TRUE";

    // SEND via fetch (prevents Google echo redirect → 403)
    const formData = new FormData(tradeForm);

    fetch(tradeForm.action, {
      method: "POST",
      body: new URLSearchParams(formData),
    })
    .then((res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(() => {
      setStatus(
        tradeStatus,
        `Gesendet ✅  ${selectedInst} ${signedR} R, ${formatDDMMYYYY(d)}`,
        "ok"
      );

      setTimeout(() => {
        document.getElementById("tradeResultR").value = "";
        const notes = document.getElementById("tradeNotes");
        if (notes) notes.value = "";

        tradeSign = 1;
        tradeSignBtn.textContent = "+";
        tradeSignBtn.classList.add("plus", "active");
        tradeSignBtn.classList.remove("minus");
      }, 50);
    })
    .catch((err) => {
      setStatus(tradeStatus, `Fehler ❌ ${err.message}`, "warn");
    });
  });

  document.getElementById("tradeClear").addEventListener("click", () => {
    document.getElementById("tradeResultR").value = "";
    const notes = document.getElementById("tradeNotes");
    if (notes) notes.value = "";

    const incSel = document.getElementById("tradeIncludeSelect");
    if (incSel) incSel.value = "TRUE";

    tradeSign = 1;
    tradeSignBtn.textContent = "+";
    tradeSignBtn.classList.add("plus", "active");
    tradeSignBtn.classList.remove("minus");

    setStatus(tradeStatus, "", "");
  });


  // --- Adjustment submit ---
  const adjForm = document.getElementById("adjForm");
  const adjStatus = document.getElementById("adjStatus");

  adjForm.addEventListener("submit", (ev) => {
    ev.preventDefault(); // IMPORTANT

    const mode = document.querySelector('input[name="adjDateMode"]:checked').value;
    const custom = document.getElementById("adjCustomDate");
    const d = dateFromMode(mode, custom);
    if (!d) {
      setStatus(adjStatus, "Bitte Datum auswählen (bei 'date').", "warn");
      return;
    }

    const amtStr = document.getElementById("adjAmount").value.trim();
    if (!amtStr) {
      setStatus(adjStatus, "Bitte Amount ($) eingeben.", "warn");
      return;
    }

    const normalizedAmt = amtStr.replace(",", ".").replace(/\s+/g, "");
    const amtValue = Number(normalizedAmt);
    if (!Number.isFinite(amtValue)) {
      setStatus(adjStatus, "Ungültige Zahl.", "warn");
      return;
    }

    const signedAmt = amtValue * adjSign;

    document.getElementById("adj_event_id").value = makeId("E");
    document.getElementById("adj_date").value = formatDDMMYYYY(d);
    document.getElementById("adj_amount_usd").value = signedAmt.toFixed(2);

    const incSel = document.getElementById("adjIncludeSelect");
    document.getElementById("adj_include").value = incSel ? incSel.value : "TRUE";

    const formData = new FormData(adjForm);

    fetch(adjForm.action, {
      method: "POST",
      body: new URLSearchParams(formData),
    })
    .then((res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(() => {
      const adjType = document.getElementById("adjTypeSelect").value;
      setStatus(
        adjStatus,
        `Gesendet ✅  ${signedAmt} $, ${adjType}, ${formatDDMMYYYY(d)}`,
        "ok"
      );

      setTimeout(() => {
        document.getElementById("adjAmount").value = "";
        const notes = document.getElementById("adjNotes");
        if (notes) notes.value = "";

        adjSign = 1;
        adjSignBtn.textContent = "+";
        adjSignBtn.classList.add("plus", "active");
        adjSignBtn.classList.remove("minus");
      }, 50);
    })
    .catch((err) => {
      setStatus(adjStatus, `Fehler ❌ ${err.message}`, "warn");
    });
  });

  document.getElementById("adjClear").addEventListener("click", () => {
    document.getElementById("adjAmount").value = "";
    const notes = document.getElementById("adjNotes");
    if (notes) notes.value = "";

    const incSel = document.getElementById("adjIncludeSelect");
    if (incSel) incSel.value = "TRUE";

    adjSign = 1;
    adjSignBtn.textContent = "+";
    adjSignBtn.classList.add("plus", "active");
    adjSignBtn.classList.remove("minus");

    setStatus(adjStatus, "", "");
  });
</script>
</body>
</html>
