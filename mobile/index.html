<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trading Dashboard (Mobile)</title>

  <style>
    :root{
      --bg0: #050a12;
      --bg1: #071224;
      --card0: rgba(12, 26, 54, 0.72);
      --card1: rgba(9, 20, 40, 0.72);
      --stroke: rgba(120, 170, 255, 0.18);
      --stroke2: rgba(120, 170, 255, 0.10);
      --text: #eaf2ff;
      --muted: rgba(234,242,255,0.58);
      --muted2: rgba(234,242,255,0.35);

      /* Chart colors */
      --blue: #3a8cff;
      --green: #40f7c2;
      --red: #ff5a6a;

      --radius: 26px;
      --radius2: 18px;
      --shadow: 0 18px 55px rgba(0,0,0,0.45);
      --inner: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    *{ box-sizing: border-box; }
    body{
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial;
      color: var(--text);
      background:
        radial-gradient(1000px 700px at 15% -10%, rgba(58,140,255,0.22), transparent 55%),
        radial-gradient(900px 600px at 100% 35%, rgba(64,247,194,0.10), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg0) 55%, #03060c);
      min-height: 100vh;
      padding: 18px 16px 28px;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1{
      margin: 0;
      font-size: 46px;
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-shadow: 0 12px 45px rgba(0,0,0,0.55);
    }

    .pillOk{
      flex: 0 0 auto;
      margin-top: 6px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(16, 60, 78, 0.72);
      border: 1px solid rgba(64,247,194,0.18);
      color: rgba(234,242,255,0.78);
      font-weight: 650;
      letter-spacing: 0.02em;
      box-shadow: var(--inner), 0 10px 30px rgba(0,0,0,0.35);
    }

    .grid{
      display:flex;
      flex-direction: column;
      gap: 14px;
    }

    .card{
      border-radius: var(--radius);
      background:
        radial-gradient(900px 320px at 20% 10%, rgba(58,140,255,0.22), transparent 58%),
        radial-gradient(700px 260px at 100% 0%, rgba(64,247,194,0.08), transparent 60%),
        linear-gradient(180deg, var(--card0), var(--card1));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow), var(--inner);
      padding: 18px 18px 16px;
      position: relative;
      overflow: hidden;
    }

    .cardTitle{
      font-size: 20px;
      color: var(--muted);
      letter-spacing: 0.01em;
      margin-bottom: 10px;
    }

    /* === KPI value sizing (smaller + responsive) === */
    .kpiValue{
      font-size: clamp(40px, 9.2vw, 52px); /* deutlich kleiner + responsive */
      line-height: 1.05;
      letter-spacing: -0.02em;
      font-weight: 850;
      color: var(--text);
      /* base shadow is subtle; real colored glow is set via JS per value */
      text-shadow: 0 10px 35px rgba(0,0,0,0.40);
    }

    .kpiValue--small{
      font-size: clamp(34px, 7.8vw, 44px); /* kleiner als vorher */
    }

    .kpiRow{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
    }

    .kpiSub{
      margin-top: 10px;
      display:flex;
      align-items:center;
      gap: 10px;
      color: var(--muted);
      font-size: 18px;
    }

    .athBadge{
      display:inline-flex;
      align-items:center;
      gap: 10px;
      color: var(--muted);
      font-size: 18px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(20, 56, 105, 0.42);
      color: rgba(234,242,255,0.70);
      box-shadow: var(--inner);
      min-width: 90px;
      justify-content:center;
    }

    .tierBadge{
      display:inline-flex;
      align-items:center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(20, 56, 105, 0.38);
      color: rgba(234,242,255,0.75);
      box-shadow: var(--inner);
      font-weight: 750;
      letter-spacing: 0.01em;
    }

    .smallText{
      color: var(--muted);
      font-size: 18px;
      line-height: 1.25;
    }

    .miniGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .miniCard{
      border-radius: var(--radius);
      background:
        radial-gradient(800px 260px at 20% 10%, rgba(58,140,255,0.20), transparent 60%),
        radial-gradient(700px 240px at 100% 0%, rgba(64,247,194,0.07), transparent 60%),
        linear-gradient(180deg, rgba(12,26,54,0.72), rgba(9,20,40,0.72));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow), var(--inner);
      padding: 18px;
      overflow:hidden;
      position: relative;
    }

    .miniTitle{
      font-size: 22px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .avgLines{
      margin-top: 10px;
      display:flex;
      flex-direction: column;
      gap: 10px;
      font-size: 18px;
      color: var(--muted);
    }
    .avgLines .pos{ color: var(--green); font-weight: 750; }
    .avgLines .neg{ color: var(--red); font-weight: 750; }
    .avgFooter{
      margin-top: 12px;
      color: var(--muted2);
      font-size: 18px;
    }

    /* Chart */
    .chartCard{
      padding: 16px 16px 14px;
    }
    .chartHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 10px;
      background: transparent;
      box-shadow: none;
    }
    .chartTitle{
      font-size: 40px;
      font-weight: 850;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .segToggle{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(10, 25, 48, 0.30);
      box-shadow: var(--inner);
    }
    .segToggle button{
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 18px;
      background: transparent;
      color: rgba(234,242,255,0.55);
      cursor:pointer;
    }
    .segToggle button.active{
      background: rgba(26, 94, 196, 0.35);
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(120,170,255,0.20), 0 10px 25px rgba(0,0,0,0.30);
    }

    .canvasWrap{
      border-radius: var(--radius);
      border: 1px solid var(--stroke2);
      background: transparent !important;
      overflow:hidden;
      position: relative;
    }
    canvas{
      width: 100%;
      height: 280px;
      display:block;
      background: transparent;
    }

    .footer{
      margin-top: 12px;
      color: rgba(234,242,255,0.40);
      font-size: 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .footer a{
      color: rgba(120,170,255,0.85);
      text-decoration:none;
      font-weight: 750;
    }

    /* Slight “glass” vignette */
    .card:before, .miniCard:before{
      content:"";
      position:absolute;
      inset:-1px;
      background:
        radial-gradient(900px 320px at 20% 0%, rgba(255,255,255,0.06), transparent 55%),
        radial-gradient(700px 260px at 100% 0%, rgba(255,255,255,0.03), transparent 65%);
      pointer-events:none;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1>Trading<br/>Dashboard</h1>
    <div id="dataPill" class="pillOk">DATA: OK</div>
  </div>

  <div class="grid">
    <!-- Current Equity -->
    <div class="card">
      <div class="cardTitle">Current Equity</div>
      <div id="curEquity" class="kpiValue">$—</div>
      <div class="kpiSub">
        <span class="athBadge">ATH</span>
        <span id="athEquity" class="badge">$—</span>
      </div>
    </div>

    <!-- Next Trade Size -->
    <div class="card">
      <div class="cardTitle">Next Trade Size ($)</div>
      <div class="kpiRow">
        <div id="nextRisk" class="kpiValue">$—</div>
        <div class="smallText" id="riskPctText"></div>
      </div>

      <div class="kpiSub" style="justify-content: space-between;">
        <span id="tierBadge" class="tierBadge">—</span>
        <span id="tierText" class="smallText">Tier 0 | Above 0% to 12% | 12–18% | &gt;18%</span>
      </div>
    </div>

    <!-- Avg R / Trade + Winrate -->
    <div class="miniGrid">
      <div class="miniCard">
        <div class="miniTitle">Avg. R / Trade</div>

        <div id="avgRValue" class="kpiValue kpiValue--small">—</div>
        <div class="kpiValue kpiValue--small" style="margin-top:-6px;">R</div>

        <div class="avgLines">
          <div><span id="avgWin" class="pos">+— R</span> &nbsp;Avg Win</div>
          <div><span id="avgLoss" class="neg">-— R</span> &nbsp;Avg Loss</div>
        </div>

        <div class="avgFooter"><span id="tradeCount">—</span> Trades</div>
      </div>

      <div class="miniCard">
        <div class="miniTitle">Winrate</div>

        <div id="winrateValue" class="kpiValue kpiValue--small">—%</div>
        <div class="smallText" style="margin-top: 10px;">
          <span id="winsLosses">— Wins / — Losses</span>
        </div>
      </div>
    </div>

    <!-- Chart -->
    <div class="card chartCard">
      <div class="chartHeader">
        <div class="chartTitle" id="chartTitle">Equity ($)</div>
        <div class="segToggle" role="tablist" aria-label="Curve toggle">
          <button id="btnEquity" class="active" type="button">Equity ($)</button>
          <button id="btnCumR" type="button">Cum R</button>
        </div>
      </div>

      <div class="canvasWrap">
        <canvas id="curveCanvas" width="900" height="420"></canvas>
      </div>

      <div class="footer">
        <span id="metaLine">Stand: — · Updated: —</span>
        <span><a href="../index.html">Desktop</a> · <a href="../entry/index.html">Zurück</a></span>
      </div>
    </div>
  </div>

<script>
  // ---------------------------
  // Config / Data endpoints
  // ---------------------------
  const DATA_BASE = "../data";
  const URL_EQUITY = `${DATA_BASE}/equity.json`;
  const URL_META   = `${DATA_BASE}/meta.json`;
  const URL_KPIS   = `${DATA_BASE}/kpis_full.json`;
  const URL_DAILY  = `${DATA_BASE}/daily_aggregates.json`;
  const URL_TRADES = `${DATA_BASE}/trades_enriched.json`;

  // ---------------------------
  // Utilities
  // ---------------------------
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function rgbToHex(r,g,b){
    const toHex = (n)=> n.toString(16).padStart(2,"0");
    return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
  }

  // Accepts "#rrggbb" only
  function mix(c1, c2, t){
    // FIX: regex must be /\w\w/g (not /\\w\\w/g), otherwise match() becomes null -> DATA: ERROR
    const a = String(c1).match(/\w\w/g)?.map(x=>parseInt(x,16));
    const b = String(c2).match(/\w\w/g)?.map(x=>parseInt(x,16));
    if (!a || !b) return c2; // safe fallback

    return rgbToHex(
      Math.round(lerp(a[0],b[0],t)),
      Math.round(lerp(a[1],b[1],t)),
      Math.round(lerp(a[2],b[2],t))
    );
  }

  function fmtMoney(x){
    if (!Number.isFinite(x)) return "$—";
    return x.toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2});
  }

  function fmtSignedR(x){
    if (!Number.isFinite(x)) return "—";
    const s = x >= 0 ? "+" : "";
    return s + x.toFixed(2);
  }

  async function fetchJSON(url){
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`Fetch failed ${res.status}: ${url}`);
    return await res.json();
  }

  // ---------------------------
  // Color rules (your spec)
  // ---------------------------
  function colorForAvgR(r){
    const RED   = "#ff5a6a";
    const WHITE = "#eaf2ff";
    // KPI-green slightly different from chart-green so it doesn't look identical
    const KPI_GREEN = "#3ff5d1";

    if (!Number.isFinite(r)) return WHITE;

    if (r <= 0){
      // [-1..0] => red->white
      const t = clamp01((r + 1) / 1);
      return mix(RED, WHITE, t);
    }
    if (r < 0.5){
      // [0..0.5] => white->green
      const t = clamp01(r / 0.5);
      return mix(WHITE, KPI_GREEN, t);
    }
    return KPI_GREEN;
  }

  function colorForWinrate(wPct){
    // input: percent (0..100)
    const RED   = "#ff5a6a";
    const WHITE = "#eaf2ff";
    const KPI_GREEN = "#3ff5d1";

    if (!Number.isFinite(wPct)) return WHITE;

    if (wPct < 50){
      // [40..50] => red->white
      const t = clamp01((wPct - 40) / 10);
      return mix(RED, WHITE, t);
    }
    if (wPct < 60){
      // [50..60] => white->green
      const t = clamp01((wPct - 50) / 10);
      return mix(WHITE, KPI_GREEN, t);
    }
    return KPI_GREEN;
  }

  // chart segment coloring: blue -> green (keep chart-green distinct)
  function colorForCurveValue(v, minV, maxV){
    const BLUE  = "#3a8cff";
    const GREEN = "#40f7c2";
    const t = (maxV > minV) ? clamp01((v - minV) / (maxV - minV)) : 0;
    return mix(BLUE, GREEN, t);
  }

  // ---------------------------
  // Chart drawing
  // ---------------------------
  function drawChart(ctx, canvas, series, modeLabel){
    const W = canvas.width;
    const H = canvas.height;

    ctx.clearRect(0,0,W,H);

    const padL = 72;
    const padR = 22;
    const padT = 26;
    const padB = 52;

    const innerW = W - padL - padR;
    const innerH = H - padT - padB;

    if (!series || series.length < 2){
      ctx.fillStyle = "rgba(234,242,255,0.35)";
      ctx.font = "600 18px ui-sans-serif";
      ctx.fillText("No data yet", padL, padT + 30);
      return;
    }

    const values = series.map(d=>d.value);
    let minV = Math.min(...values);
    let maxV = Math.max(...values);
    if (minV === maxV){
      minV -= 1; maxV += 1;
    }
    const yPad = (maxV - minV) * 0.06;
    minV -= yPad; maxV += yPad;

    // grid
    ctx.strokeStyle = "rgba(120,170,255,0.10)";
    ctx.lineWidth = 1;

    const gridLines = 5;
    ctx.font = "600 14px ui-sans-serif";
    ctx.fillStyle = "rgba(234,242,255,0.35)";

    for (let i=0;i<=gridLines;i++){
      const y = padT + (innerH * i / gridLines);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + innerW, y);
      ctx.stroke();

      const v = maxV - (maxV-minV) * (i/gridLines);
      const label = (modeLabel === "Equity") ? Math.round(v).toLocaleString("en-US") : (v).toFixed(1);
      ctx.fillText(label, 12, y + 5);
    }

    // X ticks: daily tick marks, label only on 1st + 15th
    ctx.strokeStyle = "rgba(120,170,255,0.10)";
    ctx.fillStyle = "rgba(234,242,255,0.35)";

    const n = series.length;
    function xAt(i){ return padL + (innerW * (i/(n-1))); }
    function yAt(val){
      const t = (val - minV) / (maxV - minV);
      return padT + innerH - innerH * t;
    }

    for (let i=0;i<n;i++){
      const x = xAt(i);
      ctx.beginPath();
      ctx.moveTo(x, padT + innerH);
      ctx.lineTo(x, padT + innerH + 6);
      ctx.stroke();

      const d = new Date(series[i].date);
      const day = d.getDate();
      const month = d.getMonth()+1;

      if (day === 1 || day === 15){
        const label = (day === 1) ? `${day}.${month}` : `${day}`;
        ctx.fillText(label, x-10, padT + innerH + 28);
      }
    }

    const pts = series.map((p,i)=>({x:xAt(i), y:yAt(p.value)}));

    // segments with color grading
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    const rawMin = Math.min(...values);
    const rawMax = Math.max(...values);

    for (let i=1;i<pts.length;i++){
      const v = series[i].value;
      ctx.strokeStyle = colorForCurveValue(v, rawMin, rawMax);
      ctx.beginPath();
      ctx.moveTo(pts[i-1].x, pts[i-1].y);
      ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }

    // last dot glow (chart-green)
    const last = pts[pts.length-1];
    ctx.fillStyle = "#40f7c2";
    ctx.shadowColor = "rgba(64,247,194,0.35)";
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(last.x, last.y, 3.6, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ---------------------------
  // Cum-R building (fallback)
  // ---------------------------
  function buildCumRSeriesFromTradesAndEquityDates(trades, equitySeries){
    const rDay = new Map();
    for (const t of trades){
      const d = t.date;
      const r = Number(t.result_r);
      if (!d || !Number.isFinite(r)) continue;
      rDay.set(d, (rDay.get(d) || 0) + r);
    }

    let cum = 0;
    const out = [];
    for (const e of equitySeries){
      const d = e.date;
      const dayR = rDay.get(d) || 0;
      cum += dayR;
      out.push({date: d, value: cum});
    }
    return out;
  }

  // ---------------------------
  // Main render
  // ---------------------------
  let MODE = "Equity"; // "Equity" or "CumR"
  let cached = { equity: null, kpis: null, meta: null, daily: null, trades: null };

  const el = {
    dataPill: document.getElementById("dataPill"),
    curEquity: document.getElementById("curEquity"),
    athEquity: document.getElementById("athEquity"),
    nextRisk: document.getElementById("nextRisk"),
    riskPctText: document.getElementById("riskPctText"),
    tierBadge: document.getElementById("tierBadge"),
    tierText: document.getElementById("tierText"),
    avgRValue: document.getElementById("avgRValue"),
    avgWin: document.getElementById("avgWin"),
    avgLoss: document.getElementById("avgLoss"),
    tradeCount: document.getElementById("tradeCount"),
    winrateValue: document.getElementById("winrateValue"),
    winsLosses: document.getElementById("winsLosses"),
    metaLine: document.getElementById("metaLine"),
    chartTitle: document.getElementById("chartTitle"),
    btnEquity: document.getElementById("btnEquity"),
    btnCumR: document.getElementById("btnCumR"),
    canvas: document.getElementById("curveCanvas"),
  };

  function setPill(ok, text){
    el.dataPill.textContent = text;
    el.dataPill.style.borderColor = ok ? "rgba(64,247,194,0.20)" : "rgba(255,90,106,0.28)";
    el.dataPill.style.background = ok ? "rgba(16,60,78,0.72)" : "rgba(80,20,30,0.55)";
  }

  function hexToRgb(hex){
    const m = String(hex).match(/\w\w/g);
    if (!m || m.length < 3) return {r:234,g:242,b:255};
    return { r: parseInt(m[0],16), g: parseInt(m[1],16), b: parseInt(m[2],16) };
  }

  function applyNumberColorAndGlow(node, colorHex){
    node.style.color = colorHex;

    // Glow only on the number: use the value-color itself (so gradient is obvious)
    const {r,g,b} = hexToRgb(colorHex);
    node.style.textShadow =
      `0 0 14px rgba(${r},${g},${b},0.28),
       0 0 28px rgba(${r},${g},${b},0.16),
       0 10px 35px rgba(0,0,0,0.35)`;
  }

  function resizeCanvasToDisplaySize(canvas){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(rect.width * dpr);
    const h = Math.round(rect.height * dpr);
    if (canvas.width !== w || canvas.height !== h){
      canvas.width = w;
      canvas.height = h;
    }
  }

  function render(){
    const ctx = el.canvas.getContext("2d");

    const equityArr = cached.equity || [];
    const latest = equityArr.length ? equityArr[equityArr.length - 1] : null;

    if (!latest){
      setPill(false, "DATA: MISSING");
      return;
    }

    // KPI cards
    el.curEquity.textContent = fmtMoney(latest.equity_end_$);
    el.athEquity.textContent = fmtMoney(latest.ath_$);

    el.nextRisk.textContent = fmtMoney(latest.effective_risk_$);

    const riskPct = (latest.base_equity_for_sizing_$ && latest.base_risk_$)
      ? (latest.base_risk_$ / latest.base_equity_for_sizing_$)
      : null;
    el.riskPctText.textContent = riskPct ? `${(riskPct*100).toFixed(0)}% of equity` : "";

    el.tierBadge.textContent = latest.dd_tier || "—";

    // KPIs from kpis_full.json
    const k = cached.kpis || {};
    const tradeCount = Number(k.trade_count);
    const winCount = Number(k.win_count);
    const lossCount = Number(k.loss_count);
    const winrate = Number(k.winrate); // maybe 0..1
    const winratePct = Number.isFinite(winrate) ? (winrate * 100) : NaN;

    // Avg R/Trade
    let avgR = Number(k.expectancy_R);
    if (!Number.isFinite(avgR)){
      const totalR = Number(k.total_R);
      if (Number.isFinite(totalR) && Number.isFinite(tradeCount) && tradeCount > 0){
        avgR = totalR / tradeCount;
      }
    }

    const avgWinR = Number(k.avg_win_R);
    const avgLossR = Number(k.avg_loss_R);

    el.avgRValue.textContent = fmtSignedR(avgR);
    el.avgWin.textContent = fmtSignedR(avgWinR) + " R";
    el.avgLoss.textContent = fmtSignedR(avgLossR) + " R";
    el.tradeCount.textContent = Number.isFinite(tradeCount) ? tradeCount : "—";

    el.winrateValue.textContent = Number.isFinite(winratePct) ? `${Math.round(winratePct)}%` : "—%";
    el.winsLosses.textContent =
      (Number.isFinite(winCount) && Number.isFinite(lossCount))
        ? `${winCount} Wins / ${lossCount} Losses`
        : "— Wins / — Losses";

    // Apply color gradients for AvgR & Winrate + value-based glow
    applyNumberColorAndGlow(el.avgRValue, colorForAvgR(avgR));
    applyNumberColorAndGlow(el.winrateValue, colorForWinrate(winratePct));

    // Meta footer
    const lastUpd = cached.meta?.last_updated_utc || cached.meta?.meta?.last_updated_utc || "";
    const stand = latest.date || "—";
    el.metaLine.textContent = `Stand: ${stand} · Updated: ${lastUpd || "—"}`;

    // Chart series build
    const equitySeries = equityArr
      .map(r=>({date: r.date, value: Number(r.equity_end_$)}))
      .filter(p=>p.date && Number.isFinite(p.value));

    let cumRSeries = null;

    // Preferred: daily_aggregates has r_cum
    const daily = cached.daily || [];
    const hasRCum = daily.length && daily.some(x => Number.isFinite(Number(x.r_cum)));
    if (hasRCum){
      cumRSeries = daily
        .map(d=>({date: d.date, value: Number(d.r_cum)}))
        .filter(p=>p.date && Number.isFinite(p.value));
    } else {
      const trades = cached.trades || [];
      cumRSeries = buildCumRSeriesFromTradesAndEquityDates(trades, equityArr);
    }

    resizeCanvasToDisplaySize(el.canvas);
    const series = (MODE === "Equity") ? equitySeries : cumRSeries;

    el.chartTitle.textContent = (MODE === "Equity") ? "Equity ($)" : "Cum R";
    drawChart(ctx, el.canvas, series, (MODE === "Equity") ? "Equity" : "CumR");
  }

  async function loadAll(){
    try{
      setPill(true, "DATA: LOADING");

      const [equity, meta, kpis, daily, trades] = await Promise.all([
        fetchJSON(URL_EQUITY),
        fetchJSON(URL_META).catch(()=> ({})),
        fetchJSON(URL_KPIS).catch(()=> ({})),
        fetchJSON(URL_DAILY).catch(()=> ([])),
        fetchJSON(URL_TRADES).catch(()=> ([])),
      ]);

      cached.equity = Array.isArray(equity) ? equity : [];
      cached.meta   = meta || {};
      cached.kpis   = kpis || {};
      cached.daily  = Array.isArray(daily) ? daily : [];
      cached.trades = Array.isArray(trades) ? trades : [];

      setPill(true, "DATA: OK");
      render();
    } catch(err){
      console.error(err);
      setPill(false, "DATA: ERROR");
    }
  }

  // Toggle handlers
  el.btnEquity.addEventListener("click", ()=>{
    MODE = "Equity";
    el.btnEquity.classList.add("active");
    el.btnCumR.classList.remove("active");
    render();
  });
  el.btnCumR.addEventListener("click", ()=>{
    MODE = "CumR";
    el.btnCumR.classList.add("active");
    el.btnEquity.classList.remove("active");
    render();
  });

  window.addEventListener("resize", ()=> render());

  // init
  loadAll();
</script>
</body>
</html>
