<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading Dashboard (Mobile)</title>
  <meta name="theme-color" content="#061021" />

  <style>
    :root{
      --bg0:#040812;
      --bg1:#061021;
      --text:#eaf2ff;
      --muted:#a9b8d6;
      --blue:#2c7cff;
      --blue2:#00a3ff;
      --good:#2be7a3;
      --bad:#ff5b6b;
      --glow: 0 0 0 1px rgba(44,124,255,.12), 0 20px 60px rgba(0,0,0,.35);
      --r: 18px;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(44,124,255,.22), transparent 60%),
        radial-gradient(900px 700px at 80% 10%, rgba(0,163,255,.14), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    .wrap{ max-width:520px; margin:0 auto; padding:18px 14px 24px; }
    .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .title{ font-weight:900; font-size:34px; letter-spacing:.2px; line-height:1.05; margin: 6px 0 0; }
    .pill{
      margin-top: 10px;
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 13px;
      color: rgba(200,255,240,.9);
      background: rgba(43,231,163,.10);
      border: 1px solid rgba(43,231,163,.22);
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
      white-space:nowrap;
    }
    .grid{ display:grid; gap:12px; }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border: 1px solid rgba(44,124,255,.18);
      border-radius: var(--r);
      box-shadow: var(--glow);
      overflow:hidden;
      position:relative;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-2px -2px auto -2px;
      height: 80px;
      background: radial-gradient(420px 90px at 20% 0%, rgba(44,124,255,.32), transparent 65%);
      pointer-events:none;
    }
    .card-inner{ padding: 16px 16px 14px; position:relative; z-index:1; }
    .k-title{ font-size:15px; color: rgba(190,210,255,.85); letter-spacing:.2px; margin:0 0 10px; }
    .k-main{ font-size: 46px; font-weight: 950; margin:0; letter-spacing:.4px; }
    .k-sub{
      margin-top: 8px;
      font-size: 14px;
      color: rgba(175,195,235,.82);
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .k-sub .tag{
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(44,124,255,.12);
      border: 1px solid rgba(44,124,255,.22);
      color: rgba(200,220,255,.95);
      font-size: 12px;
    }
    .good{ color: var(--good); }
    .bad{ color: var(--bad); }
    .muted{ color: var(--muted); }

    .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }

    .tinyline{
      margin-top: 10px;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      font-size: 13px;
      color: rgba(175,195,235,.82);
    }
    .tinyline .v{ font-weight: 900; color: rgba(235,245,255,.95); }
    .tinyline .v.good{ color: var(--good); }
    .tinyline .v.bad{ color: var(--bad); }

    .chart-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .chart-title{ margin:0; font-size: 16px; font-weight: 900; letter-spacing:.2px; }
    .toggle{
      display:flex;
      gap: 6px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10,20,38,.65);
      border: 1px solid rgba(44,124,255,.18);
    }
    .toggle button{
      appearance:none;
      border:0;
      cursor:pointer;
      padding: 9px 12px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 13px;
      color: rgba(195,215,255,.85);
      background: transparent;
    }
    .toggle button.active{
      background: rgba(44,124,255,.18);
      border: 1px solid rgba(44,124,255,.25);
      color: rgba(235,245,255,.98);
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
    }

    canvas{
      width: 100%;
      height: 240px;
      display:block;
      border-radius: 14px;
      background: rgba(5,10,20,.18);
      border: 1px solid rgba(44,124,255,.12);
    }

    .foot{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(160,180,220,.75);
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .err{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,91,107,.10);
      border: 1px solid rgba(255,91,107,.22);
      color: rgba(255,210,215,.95);
      font-size: 13px;
      white-space: pre-wrap;
      display:none;
    }
    a{ color: rgba(170,210,255,.95); text-decoration:none; }
    a:hover{ text-decoration:underline; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="title">Trading Dashboard</div>
      <div id="dataPill" class="pill">DATA: …</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-inner">
          <div class="k-title">Current Equity</div>
          <div id="kCurrentEquity" class="k-main">$—</div>
          <div class="k-sub">
            <span class="muted">ATH</span>
            <span id="kATH" class="tag">$—</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-inner">
          <div class="k-title">Next Trade Size ($)</div>
          <div id="kRisk" class="k-main">$—</div>
          <div class="k-sub">
            <span id="kTier" class="tag">Tier —</span>
            <span id="kTierInfo" class="muted">—</span>
          </div>
        </div>
      </div>

      <div class="row2">
        <div class="card">
          <div class="card-inner">
            <div class="k-title">Avg. R / Trade</div>
            <div id="kAvgR" class="k-main">— R</div>

            <div class="tinyline">
              <div><span class="v good" id="kAvgWin">— R</span> <span class="muted">Avg Win</span></div>
            </div>
            <div class="tinyline" style="margin-top:6px;">
              <div><span class="v bad" id="kAvgLoss">— R</span> <span class="muted">Avg Loss</span></div>
            </div>

            <div class="k-sub" style="margin-top:12px;">
              <span id="kTradeCount" class="muted">— Trades</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-inner">
            <div class="k-title">Winrate</div>
            <div id="kWinrate" class="k-main">—%</div>
            <div class="k-sub">
              <span id="kWLCounts" class="muted">— Wins / — Losses</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-inner">
          <div class="chart-head">
            <div class="chart-title" id="chartTitle">Equity ($)</div>
            <div class="toggle">
              <button id="btnEquity" class="active" type="button">Equity ($)</button>
              <button id="btnR" type="button">Cum R</button>
            </div>
          </div>

          <canvas id="chart" width="900" height="420"></canvas>

          <div class="foot">
            <div id="metaLine">Stand: —</div>
            <div><a href="../" title="Desktop Dashboard">Desktop</a></div>
          </div>

          <div id="errBox" class="err"></div>
        </div>
      </div>
    </div>
  </div>

<script>
const DATA_BASE = "../data";
const $ = (id) => document.getElementById(id);

function fmtUSD(n){
  if (n === null || n === undefined || !Number.isFinite(n)) return "$—";
  return n.toLocaleString("en-US", { style:"currency", currency:"USD", maximumFractionDigits:2 });
}
function fmtR(n){
  if (n === null || n === undefined || !Number.isFinite(n)) return "— R";
  const s = (n>=0?"+":"") + n.toFixed(2);
  return s + " R";
}
function toNum(x){
  if (x === null || x === undefined) return null;
  if (typeof x === "number") return Number.isFinite(x) ? x : null;
  if (typeof x === "string"){
    let s = x.trim();
    if (!s) return null;
    s = s.replace(/\$/g, "").replace(/\s+/g, "");
    if (s.includes(".") && s.includes(",")) s = s.replace(/,/g, "");
    else s = s.replace(/,/g, ".");
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }
  const n = Number(x);
  return Number.isFinite(n) ? n : null;
}
async function fetchJSON(filename){
  const url = `${DATA_BASE}/${filename}`;
  const res = await fetch(url, { cache:"no-store" });
  if (!res.ok) throw new Error(`Fetch failed ${res.status}: ${url}`);
  return await res.json();
}
function pickNum(obj, keys){
  for (const k of keys){
    if (obj && Object.prototype.hasOwnProperty.call(obj, k)){
      const v = toNum(obj[k]);
      if (Number.isFinite(v)) return v;
    }
  }
  return null;
}
function tierInfoText(config){
  const t1 = toNum(config?.dd_tiers?.t1) ?? 0.12;
  const t2 = toNum(config?.dd_tiers?.t2) ?? 0.18;
  const p1 = Math.round(t1*100);
  const p2 = Math.round(t2*100);
  return `Tier 0 | Above 0% to ${p1}% | ${p1}–${p2}% | >${p2}%`;
}

/** ---- Date helpers ---- */
function pad2(n){ return String(n).padStart(2,"0"); }
function toISODate(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }

function parseDateAny(s){
  // Accept:
  // - "YYYY-MM-DD"
  // - "MM/DD/YYYY"
  // - "DD.MM.YYYY"
  if (!s) return null;
  const str = String(s).trim();

  // YYYY-MM-DD
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return { y:+m[1], mo:+m[2], d:+m[3], iso:str };

  // MM/DD/YYYY
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m){
    const mo = +m[1], d = +m[2], y = +m[3];
    return { y, mo, d, iso: toISODate(y,mo,d) };
  }

  // DD.MM.YYYY
  m = str.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (m){
    const d = +m[1], mo = +m[2], y = +m[3];
    return { y, mo, d, iso: toISODate(y,mo,d) };
  }

  return null;
}

function addDaysISO(iso, delta){
  const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  const dt = new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  dt.setUTCDate(dt.getUTCDate() + delta);
  return toISODate(dt.getUTCFullYear(), dt.getUTCMonth()+1, dt.getUTCDate());
}

/**
 * Build calendar spine: all days between minDate and maxDate (inclusive)
 */
function buildCalendarSpine(minISO, maxISO){
  if (!minISO || !maxISO) return [];
  const out = [];
  let cur = minISO;
  while (cur <= maxISO){
    out.push(cur);
    cur = addDaysISO(cur, 1);
    if (!cur) break;
  }
  return out;
}

/**
 * Build series:
 * - equity.json provides equity_end_$ on some days (not all calendar days)
 * - trades_enriched.json provides trades with result_r and date -> sum per day
 * -> fill ALL calendar days, carry forward equity and cumR
 */
function buildDailySeries(equityArr, tradesArr){
  const eqMap = new Map(); // date -> equity_end
  let minISO = null, maxISO = null;

  for (const r of (Array.isArray(equityArr) ? equityArr : [])){
    if (!r?.date) continue;
    const di = parseDateAny(r.date)?.iso;
    if (!di) continue;
    const eq = toNum(r["equity_end_$"]) ?? toNum(r.cash_equity_$) ?? null;
    if (Number.isFinite(eq)) eqMap.set(di, eq);
    if (!minISO || di < minISO) minISO = di;
    if (!maxISO || di > maxISO) maxISO = di;
  }

  // daily R sums by date (Trades-only)
  const rMap = new Map(); // date -> daily sum R
  for (const t of (Array.isArray(tradesArr) ? tradesArr : [])){
    // include flag (default TRUE if missing)
    const incRaw = (t?.include ?? t?.Include ?? t?.included ?? "TRUE");
    const inc = String(incRaw).trim().toUpperCase() !== "FALSE";
    if (!inc) continue;

    const di = parseDateAny(t?.date)?.iso ?? parseDateAny(t?.trade_date)?.iso ?? null;
    if (!di) continue;

    const r = toNum(t?.result_r) ?? toNum(t?.trade_result_r) ?? toNum(t?.r) ?? toNum(t?.R) ?? null;
    if (!Number.isFinite(r)) continue;

    rMap.set(di, (rMap.get(di) ?? 0) + r);

    if (!minISO || di < minISO) minISO = di;
    if (!maxISO || di > maxISO) maxISO = di;
  }

  const spine = buildCalendarSpine(minISO, maxISO);
  const out = [];

  let lastEq = null;
  let cumR = 0;

  for (const d of spine){
    const eqHere = eqMap.has(d) ? eqMap.get(d) : null;
    if (Number.isFinite(eqHere)) lastEq = eqHere; // update carry-forward
    const dailyR = rMap.get(d) ?? 0;
    cumR += dailyR;

    out.push({
      date: d,
      equity: Number.isFinite(lastEq) ? lastEq : null,
      dailyR,
      cumR
    });
  }

  return out;
}

function drawLineChart(canvas, series, mode){
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  const m = { l:70, r:18, t:18, b:46 };
  const iw = W - m.l - m.r;
  const ih = H - m.t - m.b;

  const values = series
    .map(p => mode === "equity" ? p.equity : p.cumR)
    .filter(v => Number.isFinite(v));

  if (values.length < 2){
    ctx.fillStyle = "rgba(190,210,255,.75)";
    ctx.font = "700 16px system-ui";
    ctx.fillText("No data yet", m.l, m.t + 22);
    return;
  }

  let vMin = Math.min(...values);
  let vMax = Math.max(...values);
  if (vMin === vMax){ vMin -= 1; vMax += 1; }
  const pad = (vMax - vMin) * 0.08;
  vMin -= pad; vMax += pad;

  const xAt = (i) => m.l + (i/(series.length-1))*iw;
  const yAt = (v) => m.t + (1 - (v - vMin)/(vMax - vMin))*ih;

  // grid
  ctx.strokeStyle = "rgba(44,124,255,.10)";
  ctx.lineWidth = 1;
  ctx.setLineDash([6,6]);
  const gridN = 5;
  for (let i=0;i<=gridN;i++){
    const y = m.t + (i/gridN)*ih;
    ctx.beginPath(); ctx.moveTo(m.l, y); ctx.lineTo(W - m.r, y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // y labels
  ctx.fillStyle = "rgba(170,190,230,.75)";
  ctx.font = "600 12px system-ui";
  for (let i=0;i<=gridN;i++){
    const v = vMax - (i/gridN)*(vMax - vMin);
    const y = m.t + (i/gridN)*ih;
    const label = (mode==="equity") ? fmtUSD(v).replace("$","") : (v>=0?"+":"") + v.toFixed(1);
    ctx.fillText(label, 10, y+4);
  }

  // x labels: 1st and 15th
  ctx.fillStyle = "rgba(170,190,230,.72)";
  ctx.font = "600 12px system-ui";
  for (let i=0;i<series.length;i++){
    const d = series[i].date; // YYYY-MM-DD
    const day = Number(String(d).slice(8,10));
    if (day !== 1 && day !== 15) continue;
    const x = xAt(i);

    ctx.strokeStyle = "rgba(44,124,255,.14)";
    ctx.beginPath(); ctx.moveTo(x, m.t); ctx.lineTo(x, m.t+ih); ctx.stroke();

    const mon = String(d).slice(5,7);
    const label = (day===1) ? `1.${mon}` : "15";
    ctx.fillText(label, x-10, H-18);
  }

  // line
  const grad = ctx.createLinearGradient(m.l,0,W-m.r,0);
  grad.addColorStop(0, "rgba(44,124,255,.95)");
  grad.addColorStop(1, "rgba(0,163,255,.95)");

  ctx.strokeStyle = grad;
  ctx.lineWidth = 3;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.beginPath();

  let first = true;
  for (let i=0;i<series.length;i++){
    const v = mode==="equity" ? series[i].equity : series[i].cumR;
    if (!Number.isFinite(v)) continue;
    const x = xAt(i);
    const y = yAt(v);
    if (first){ ctx.moveTo(x,y); first = false; }
    else ctx.lineTo(x,y);
  }
  ctx.stroke();

  // fill
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = grad;
  ctx.beginPath();
  let started = false;
  for (let i=0;i<series.length;i++){
    const v = mode==="equity" ? series[i].equity : series[i].cumR;
    if (!Number.isFinite(v)) continue;
    const x = xAt(i);
    const y = yAt(v);
    if (!started){
      ctx.moveTo(x, m.t+ih);
      ctx.lineTo(x,y);
      started = true;
    } else {
      ctx.lineTo(x,y);
    }
  }
  ctx.lineTo(m.l+iw, m.t+ih);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

async function main(){
  const errBox = $("errBox");
  try{
    const [equityArr, tradesEnriched, kpis, meta] = await Promise.all([
      fetchJSON("equity.json"),
      fetchJSON("trades_enriched.json"),
      fetchJSON("kpis_full.json"),
      fetchJSON("meta.json"),
    ]);

    const latest = Array.isArray(equityArr) && equityArr.length ? equityArr[equityArr.length-1] : {};

    const curEq = pickNum(latest, ["equity_end_$","cash_equity_$","equity_end","cash_equity"]);
    const ath  = pickNum(latest, ["ath_$","ath"]) ?? curEq;
    const effRisk = pickNum(latest, ["effective_risk_$","effective_risk"]);
    const ddTier = latest?.dd_tier || "—";

    $("kCurrentEquity").textContent = fmtUSD(curEq);
    $("kATH").textContent = fmtUSD(ath);
    $("kRisk").textContent = fmtUSD(effRisk);
    $("kTier").textContent = String(ddTier);
    $("kTierInfo").textContent = tierInfoText(meta?.config || {});

    // KPIs (Trades only)
    const winrate = toNum(kpis?.winrate);
    const winCount = toNum(kpis?.win_count);
    const lossCount = toNum(kpis?.loss_count);
    const tradeCount = toNum(kpis?.trade_count);

    // Avg R per trade: try direct fields, else compute from totals / win-loss components
let avgR =
  toNum(kpis?.avg_R) ??
  toNum(kpis?.avg_r) ??
  toNum(kpis?.avg_result_r) ??
  toNum(kpis?.expectancy_R) ??
  toNum(kpis?.expectancy_r) ??
  null;

if (!Number.isFinite(avgR)) {
  const totalR = toNum(kpis?.total_R) ?? toNum(kpis?.total_r) ?? null;
  const tc = toNum(kpis?.trade_count) ?? null;
  if (Number.isFinite(totalR) && Number.isFinite(tc) && tc > 0) {
    avgR = totalR / tc;
  }
}

if (!Number.isFinite(avgR)) {
  const wc = toNum(kpis?.win_count);
  const lc = toNum(kpis?.loss_count);
  const bc = toNum(kpis?.breakeven_count) ?? 0;
  const tc = toNum(kpis?.trade_count);
  const aw = toNum(kpis?.avg_win_R) ?? toNum(kpis?.avg_win_r);
  const al = toNum(kpis?.avg_loss_R) ?? toNum(kpis?.avg_loss_r);
  if ([wc, lc, tc, aw, al].every(Number.isFinite) && tc > 0) {
    avgR = ((wc * aw) + (lc * al) + (bc * 0)) / tc;
  }
}

    const avgWin = toNum(kpis?.avg_win_R) ?? toNum(kpis?.avg_win_r) ?? null;
    const avgLoss = toNum(kpis?.avg_loss_R) ?? toNum(kpis?.avg_loss_r) ?? null;

    $("kWinrate").textContent = (Number.isFinite(winrate) ? (winrate*100).toFixed(0) + "%" : "—%");
    $("kWLCounts").textContent = `${Number.isFinite(winCount)?winCount:"—"} Wins / ${Number.isFinite(lossCount)?lossCount:"—"} Losses`;
    $("kAvgR").textContent = fmtR(avgR);
    $("kAvgWin").textContent = fmtR(avgWin);
    $("kAvgLoss").textContent = fmtR(avgLoss).replace("+","");
    $("kTradeCount").textContent = `${Number.isFinite(tradeCount)?tradeCount:"—"} Trades`;

    const last = meta?.last_updated_utc || "—";
    const standDate = latest?.date || "—";
    $("metaLine").textContent = `Stand: ${standDate} · Updated: ${last}`;

    $("dataPill").textContent = "DATA: OK";

    // Build full calendar series (Equity carry-forward + Trades-only CumR)
    const series = buildDailySeries(equityArr, tradesEnriched);

    let mode = "equity";
    const canvas = $("chart");
    const btnEquity = $("btnEquity");
    const btnR = $("btnR");
    const title = $("chartTitle");

    function setMode(m){
      mode = m;
      btnEquity.classList.toggle("active", mode==="equity");
      btnR.classList.toggle("active", mode==="r");
      title.textContent = (mode==="equity") ? "Equity ($)" : "Cum R";
      drawLineChart(canvas, series, mode==="equity" ? "equity" : "r");
    }

    btnEquity.addEventListener("click", () => setMode("equity"));
    btnR.addEventListener("click", () => setMode("r"));
    setMode("equity");

  } catch (e){
    console.error(e);
    $("dataPill").textContent = "DATA: ERROR";
    $("dataPill").style.background = "rgba(255,91,107,.10)";
    $("dataPill").style.borderColor = "rgba(255,91,107,.22)";
    $("dataPill").style.color = "rgba(255,210,215,.95)";
    errBox.style.display = "block";
    errBox.textContent = String(e?.message || e);
  }
}

main();
</script>
</body>
</html>
