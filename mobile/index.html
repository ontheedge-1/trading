<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading Dashboard (Mobile)</title>

  <style>
    :root{
      --bg0:#040814;
      --bg1:#061022;
      --bg2:#081a33;
      --card0: rgba(10,24,48,.65);
      --card1: rgba(8,18,36,.55);
      --stroke: rgba(85,160,255,.18);
      --stroke2: rgba(85,160,255,.12);
      --text: rgba(235,245,255,.95);
      --muted: rgba(215,235,255,.60);
      --muted2: rgba(215,235,255,.42);

      --blue:#4aa3ff;
      --blue2:#2f7cff;

      --green:#2be7a3;
      --red:#ff5b6b;

      --pill: rgba(14,38,74,.65);
      --pillStroke: rgba(85,160,255,.18);

      --radius: 22px;
      --radius2: 18px;
      --pad: 16px;
    }

    html,body{height:100%;}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--text);
      background:
        radial-gradient(1200px 900px at 20% -10%, rgba(80,140,255,.18), transparent 55%),
        radial-gradient(900px 900px at 90% 20%, rgba(40,220,170,.08), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0) 55%, #02040a);
    }

    .wrap{
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 14px 26px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin: 8px 2px 16px;
    }

    .title{
      font-weight: 800;
      letter-spacing: .2px;
      font-size: 44px;
      line-height: 1.02;
      margin: 0;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(18,50,66,.65);
      border: 1px solid rgba(45,210,170,.22);
      box-shadow: 0 10px 24px rgba(0,0,0,.30), inset 0 0 0 1px rgba(255,255,255,.04);
      color: rgba(190,255,238,.95);
      font-weight: 700;
      font-size: 14px;
      white-space:nowrap;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card{
      border-radius: var(--radius);
      padding: 18px;
      background:
        radial-gradient(600px 300px at 35% 10%, rgba(70,140,255,.22), transparent 60%),
        linear-gradient(180deg, rgba(10,26,55,.72), rgba(7,14,28,.62));
      border: 1px solid var(--stroke);
      box-shadow: 0 18px 34px rgba(0,0,0,.40), inset 0 0 0 1px rgba(255,255,255,.04);
      position: relative;
      overflow:hidden;
    }

    .card:before{
      content:"";
      position:absolute;
      inset:-1px;
      background: radial-gradient(900px 220px at 30% 0%, rgba(90,160,255,.18), transparent 60%);
      pointer-events:none;
      opacity:.9;
    }

    .k-label{
      position:relative;
      font-size: 22px;
      color: var(--muted);
      letter-spacing:.2px;
      margin-bottom: 10px;
    }

    /* Big numbers: slightly smaller & glow driven by --kcolor */
    .k-main{
      position:relative;
      font-weight: 900;
      font-size: 56px; /* adjust here if still too big */
      letter-spacing: .2px;
      color: var(--kcolor, var(--text));
      text-shadow:
        0 0 16px rgba(80,140,255,.18),
        0 0 26px rgba(80,140,255,.10);
    }

    /* extra subtle glow only on big numbers, tinted by current color */
    .k-glow{
      filter: drop-shadow(0 0 10px rgba(80,140,255,.22)) drop-shadow(0 0 18px rgba(45,231,163,.10));
    }

    .subrow{
      position:relative;
      margin-top: 10px;
      display:flex;
      align-items:center;
      gap: 12px;
      flex-wrap:wrap;
      color: var(--muted);
      font-size: 18px;
    }

    .chip{
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--pill);
      border: 1px solid var(--pillStroke);
      color: rgba(220,240,255,.78);
      font-weight: 700;
      font-size: 16px;
    }

    .smalltext{
      position:relative;
      margin-top: 10px;
      color: var(--muted2);
      font-size: 16px;
    }

    .row2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .mini .k-main{ font-size: 52px; }
    .mini .k-label{ font-size: 22px; }

    .kv{
      position:relative;
      display:flex;
      align-items:baseline;
      gap: 10px;
      margin-top: 14px;
      font-size: 18px;
    }
    .kv .pos{ color: rgba(70,240,190,.95); font-weight: 800; }
    .kv .neg{ color: rgba(255,110,125,.95); font-weight: 800; }
    .kv span{ color: var(--muted); }

    /* Chart card: remove “full-width blue background” feel */
    .chart-card{
      background: transparent !important;
      border: 1px solid var(--stroke2);
      box-shadow: none;
      padding: 16px;
    }
    .chart-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .chart-title{
      font-weight: 900;
      font-size: 28px;
      letter-spacing:.2px;
      color: rgba(235,245,255,.92);
    }

    .toggle{
      display:inline-flex;
      gap: 6px;
      background: rgba(12,28,54,.65);
      border: 1px solid rgba(85,160,255,.18);
      border-radius: 999px;
      padding: 6px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .tbtn{
      border:0;
      cursor:pointer;
      padding: 10px 14px;
      border-radius: 999px;
      background: transparent;
      color: rgba(215,235,255,.70);
      font-weight: 800;
      font-size: 16px;
    }
    .tbtn.active{
      background: rgba(30,95,210,.28);
      border: 1px solid rgba(85,160,255,.18);
      color: rgba(235,245,255,.95);
      box-shadow: 0 10px 20px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.04);
    }

    canvas{
      width:100%;
      height: 240px;
      display:block;
      border-radius: 18px;
      background: rgba(5,10,20,.14); /* neutral plot background */
      border: 1px solid rgba(85,160,255,.10);
    }

    .footer{
      margin-top: 12px;
      color: rgba(215,235,255,.45);
      font-size: 16px;
      line-height: 1.35;
    }

    a{ color: rgba(140,200,255,.88); text-decoration:none; font-weight:800; }
    a:hover{ text-decoration:underline; }

    @media (max-width: 390px){
      .title{ font-size: 40px; }
      .k-main{ font-size: 52px; } /* still large but a bit smaller on tiny phones */
      .mini .k-main{ font-size: 48px; }
      canvas{ height: 220px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <h1 class="title">Trading<br/>Dashboard</h1>
      <div class="pill" id="dataPill">DATA: …</div>
    </div>

    <div class="grid">

      <!-- Current Equity -->
      <div class="card" id="cardEquity">
        <div class="k-label">Current Equity</div>
        <div class="k-main k-glow" id="kEquity" style="--kcolor: rgba(235,245,255,.95)">$—</div>
        <div class="subrow">
          <div style="opacity:.75">ATH</div>
          <div class="chip" id="kAth">$—</div>
        </div>
      </div>

      <!-- Next Trade Size -->
      <div class="card" id="cardRisk">
        <div class="k-label">Next Trade Size ($)</div>
        <div class="k-main k-glow" id="kRisk" style="--kcolor: rgba(235,245,255,.95)">$—</div>
        <div class="subrow">
          <div class="chip" id="kTier">—</div>
          <div style="opacity:.78" id="kTierText">Tier 0 | Above 0% to 12% | 12–18% | &gt;18%</div>
        </div>
      </div>

      <!-- Avg R + Winrate -->
      <div class="row2">
        <div class="card mini" id="cardAvgR">
          <div class="k-label">Avg. R / Trade</div>
          <div class="k-main k-glow" id="kAvgR" style="--kcolor: rgba(235,245,255,.95)">— R</div>

          <div class="kv">
            <div class="pos" id="kAvgWin">+— R</div><span>Avg Win</span>
          </div>
          <div class="kv" style="margin-top:8px;">
            <div class="neg" id="kAvgLoss">-— R</div><span>Avg Loss</span>
          </div>

          <div class="smalltext"><span id="kTradeCount">—</span> Trades</div>
        </div>

        <div class="card mini" id="cardWinrate">
          <div class="k-label">Winrate</div>
          <div class="k-main k-glow" id="kWinrate" style="--kcolor: rgba(235,245,255,.95)">—%</div>
          <div class="smalltext" id="kWL">— Wins / — Losses</div>
        </div>
      </div>

      <!-- Chart -->
      <div class="card chart-card" id="cardChart">
        <div class="chart-head">
          <div class="chart-title">Equity ($)</div>
          <div class="toggle" role="tablist" aria-label="Curve toggle">
            <button class="tbtn active" id="btnEquity" type="button">Equity ($)</button>
            <button class="tbtn" id="btnR" type="button">Cum R</button>
          </div>
        </div>

        <canvas id="curve" width="900" height="420"></canvas>

        <div class="footer" id="metaLine">
          Stand: — · Updated: —
          <div style="margin-top:6px;"><a href="../index.html">Desktop</a> · <a href="../entry/index.html">Zurück</a></div>
        </div>
      </div>

    </div>
  </div>

<script>
/* =========================
   Helpers
========================= */
function $(id){ return document.getElementById(id); }
function clamp01(x){ return Math.max(0, Math.min(1, x)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function toNum(x){
  const n = Number(x);
  return Number.isFinite(n) ? n : NaN;
}
function fmtMoney(x){
  if (!Number.isFinite(x)) return "$—";
  return x.toLocaleString("en-US", {style:"currency", currency:"USD", maximumFractionDigits:2});
}
function fmtPct(x){
  if (!Number.isFinite(x)) return "—%";
  return (x*100).toFixed(0) + "%";
}
function fmtR(x){
  if (!Number.isFinite(x)) return "— R";
  const sign = x >= 0 ? "+" : "";
  return sign + x.toFixed(2) + " R";
}
function fmtRSmall(x){
  if (!Number.isFinite(x)) return "— R";
  const sign = x >= 0 ? "+" : "";
  return sign + x.toFixed(2) + " R";
}

/* smooth red/white/green ramp */
function lerpRGB(c1,c2,t){
  return `rgb(${Math.round(lerp(c1[0],c2[0],t))},${Math.round(lerp(c1[1],c2[1],t))},${Math.round(lerp(c1[2],c2[2],t))})`;
}
function rampRedWhiteGreen(x, lo, midLo, midHi, hi){
  const RED   = [255,  91, 107];
  const WHITE = [234, 242, 255];
  const GREEN = [ 43, 231, 163];

  if (!Number.isFinite(x)) return "rgba(234,242,255,.95)";

  if (x <= lo) return lerpRGB(RED, RED, 0);
  if (x >= hi) return lerpRGB(GREEN, GREEN, 0);

  if (x < midLo){
    const t = clamp01((x - lo) / (midLo - lo));
    return lerpRGB(RED, WHITE, t);
  }
  if (x <= midHi){
    return lerpRGB(WHITE, WHITE, 0);
  }
  const t = clamp01((x - midHi) / (hi - midHi));
  return lerpRGB(WHITE, GREEN, t);
}

/* for chart segment colors: blue -> green */
function blueToGreen(t){
  // base blue and target green
  const BLUE  = [ 74, 163, 255]; // #4aa3ff
  const GREEN = [ 43, 231, 163]; // #2be7a3
  t = clamp01(t);
  return lerpRGB(BLUE, GREEN, t);
}

/* =========================
   Fetch data
========================= */
async function loadJSON(url){
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status + " for " + url);
  return await res.json();
}

/* =========================
   Chart drawing
========================= */
function drawLineChart(canvas, series, labels, mode){
  // mode: "equity" or "cumr"
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  // padding
  const padL = 70, padR = 22, padT = 18, padB = 56;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  // guard
  if(!series || series.length < 2){
    ctx.fillStyle = "rgba(215,235,255,.55)";
    ctx.font = "700 18px system-ui";
    ctx.fillText("No data yet", padL + 10, padT + 40);
    return;
  }

  // range
  let minY = Infinity, maxY = -Infinity;
  for(const v of series){
    if(Number.isFinite(v)){
      if(v < minY) minY = v;
      if(v > maxY) maxY = v;
    }
  }
  if(!Number.isFinite(minY) || !Number.isFinite(maxY) || minY === maxY){
    minY = minY - 1;
    maxY = maxY + 1;
  }

  // slight margins
  const yPad = (maxY - minY) * 0.08;
  minY -= yPad;
  maxY += yPad;

  // axis mappers
  const xOf = (i)=> padL + (i/(series.length-1))*plotW;
  const yOf = (v)=> padT + (1 - (v - minY)/(maxY - minY))*plotH;

  // grid lines
  ctx.strokeStyle = "rgba(85,160,255,.10)";
  ctx.lineWidth = 1;

  const gridY = 5;
  for(let k=0;k<=gridY;k++){
    const y = padT + (k/gridY)*plotH;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(W-padR, y);
    ctx.stroke();
  }

  // Y labels
  ctx.fillStyle = "rgba(215,235,255,.60)";
  ctx.font = "600 14px system-ui";
  for(let k=0;k<=gridY;k++){
    const v = maxY - (k/gridY)*(maxY-minY);
    const y = padT + (k/gridY)*plotH;
    let txt;
    if(mode==="equity"){
      txt = v.toLocaleString("en-US",{maximumFractionDigits:0});
    }else{
      txt = v.toFixed(1);
    }
    ctx.fillText(txt, 10, y+5);
  }

  // X ticks (all calendar days but label only 1st and 15th)
  ctx.fillStyle = "rgba(215,235,255,.45)";
  ctx.font = "600 14px system-ui";
  const n = labels.length;

  for(let i=0;i<n;i++){
    const lab = labels[i]; // "YYYY-MM-DD"
    if(!lab) continue;
    const day = Number(lab.slice(8,10));
    if(day !== 1 && day !== 15) continue;

    const x = xOf(i);
    // small tick line
    ctx.strokeStyle = "rgba(85,160,255,.10)";
    ctx.beginPath();
    ctx.moveTo(x, padT+plotH);
    ctx.lineTo(x, padT+plotH+8);
    ctx.stroke();

    // label
    let show = day===1 ? (lab.slice(5,7) + "." ) : "15";
    // if day==1 show month as "MM."
    ctx.fillText(show, x-10, H-18);
  }

  // Fill under curve (subtle)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(xOf(0), yOf(series[0]));
  for(let i=1;i<series.length;i++){
    ctx.lineTo(xOf(i), yOf(series[i]));
  }
  ctx.lineTo(xOf(series.length-1), padT+plotH);
  ctx.lineTo(xOf(0), padT+plotH);
  ctx.closePath();

  const gradFill = ctx.createLinearGradient(0,padT,0,padT+plotH);
  gradFill.addColorStop(0, "rgba(74,163,255,.10)");
  gradFill.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = gradFill;
  ctx.fill();
  ctx.restore();

  // Determine series max for coloring (ATH should be max green)
  const trueMax = Math.max(...series.filter(Number.isFinite));
  const denom = (trueMax === 0) ? 1 : trueMax;

  // line with per-segment color: blue -> green as value approaches max
  ctx.lineWidth = 3.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // glow
  ctx.shadowColor = "rgba(74,163,255,.35)";
  ctx.shadowBlur = 10;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

  for(let i=1;i<series.length;i++){
    const v0 = series[i-1], v1 = series[i];
    if(!Number.isFinite(v0) || !Number.isFinite(v1)) continue;

    // t based on current point vs max => at ATH => 1 => green
    const t = clamp01(v1 / denom);
    ctx.strokeStyle = blueToGreen(t);

    ctx.beginPath();
    ctx.moveTo(xOf(i-1), yOf(v0));
    ctx.lineTo(xOf(i), yOf(v1));
    ctx.stroke();
  }

  // last point marker
  const last = series.length-1;
  const vLast = series[last];
  if(Number.isFinite(vLast)){
    const t = clamp01(vLast/denom);
    ctx.shadowBlur = 16;
    ctx.fillStyle = blueToGreen(t);
    ctx.beginPath();
    ctx.arc(xOf(last), yOf(vLast), 4.6, 0, Math.PI*2);
    ctx.fill();
  }
}

/* =========================
   Main render
========================= */
let curveMode = "equity"; // "equity" or "cumr"
let started = false;

async function main(){
  if(started) return;
  started = true;

  const dataPill = $("dataPill");
  dataPill.textContent = "DATA: …";

  let equityRows=[], kpis=null, meta=null;

  try{
    [equityRows, kpis, meta] = await Promise.all([
      loadJSON("../data/equity.json"),
      loadJSON("../data/kpis_full.json"),
      loadJSON("../data/meta.json"),
    ]);
    dataPill.textContent = "DATA: OK";
  }catch(e){
    console.error(e);
    dataPill.textContent = "DATA: ERR";
    dataPill.style.borderColor = "rgba(255,91,107,.35)";
    dataPill.style.color = "rgba(255,200,205,.95)";
  }

  // latest equity row
  const lastRow = Array.isArray(equityRows) && equityRows.length ? equityRows[equityRows.length-1] : null;

  // Current Equity + ATH
  const curEq = toNum(lastRow?.equity_end_$);
  const ath = toNum(lastRow?.ath_$);
  $("kEquity").textContent = fmtMoney(curEq);
  $("kAth").textContent = fmtMoney(ath);

  // Next trade size + tier chip
  const risk = toNum(lastRow?.effective_risk_$);
  $("kRisk").textContent = fmtMoney(risk);
  $("kTier").textContent = (lastRow?.dd_tier ?? "—").replace("–","–");

  // KPIs
  const tradeCount = toNum(kpis?.trade_count);
  const winCount = toNum(kpis?.win_count);
  const lossCount = toNum(kpis?.loss_count);

  // Avg win/loss (R)
  const avgWin = toNum(kpis?.avg_win_R ?? kpis?.avg_win_r);
  const avgLoss = toNum(kpis?.avg_loss_R ?? kpis?.avg_loss_r);

  $("kTradeCount").textContent = Number.isFinite(tradeCount) ? String(tradeCount) : "—";
  $("kWL").textContent = `${Number.isFinite(winCount)?winCount:"—"} Wins / ${Number.isFinite(lossCount)?lossCount:"—"} Losses`;
  $("kAvgWin").textContent = fmtRSmall(avgWin);
  $("kAvgLoss").textContent = fmtRSmall(avgLoss);

  // Avg R per trade (robust)
  let avgR =
    toNum(kpis?.avg_R) ??
    toNum(kpis?.avg_r) ??
    toNum(kpis?.avg_result_r) ??
    toNum(kpis?.expectancy_R) ??
    toNum(kpis?.expectancy_r) ??
    NaN;

  if (!Number.isFinite(avgR)) {
    const totalR = toNum(kpis?.total_R) ?? toNum(kpis?.total_r) ?? NaN;
    if (Number.isFinite(totalR) && Number.isFinite(tradeCount) && tradeCount > 0) avgR = totalR / tradeCount;
  }

  if (!Number.isFinite(avgR)) {
    const bc = toNum(kpis?.breakeven_count) ?? 0;
    if ([winCount, lossCount, tradeCount, avgWin, avgLoss].every(Number.isFinite) && tradeCount > 0) {
      avgR = ((winCount * avgWin) + (lossCount * avgLoss) + (bc * 0)) / tradeCount;
    }
  }

  $("kAvgR").textContent = fmtR(avgR);

  // Winrate
  let winrate = toNum(kpis?.winrate);
  if(!Number.isFinite(winrate) && Number.isFinite(winCount) && Number.isFinite(tradeCount) && tradeCount>0){
    winrate = winCount / tradeCount;
  }
  $("kWinrate").textContent = Number.isFinite(winrate) ? (winrate*100).toFixed(0) + "%" : "—%";

  // ==== Color formatting (smooth) + glow uses current text color ====
  // Avg R: red < 0, white ~0..0.5, green >=0.5
  const avgRColor = rampRedWhiteGreen(avgR, 0.0, 0.15, 0.35, 0.5);
  $("kAvgR").style.color = avgRColor;
  $("kAvgR").style.setProperty("--kcolor", avgRColor);
  $("kAvgR").style.textShadow =
    `0 0 12px ${avgRColor}33, 0 0 22px ${avgRColor}22`;

  // Winrate: red <50%, white 50–60, green >=60
  const wrPct = Number.isFinite(winrate) ? winrate*100 : NaN;
  const wrColor = rampRedWhiteGreen(wrPct, 50, 53, 57, 60);
  $("kWinrate").style.color = wrColor;
  $("kWinrate").style.setProperty("--kcolor", wrColor);
  $("kWinrate").style.textShadow =
    `0 0 12px ${wrColor}33, 0 0 22px ${wrColor}22`;

  // Keep equity + risk mostly white but with subtle blue glow
  const white = "rgba(235,245,255,.95)";
  $("kEquity").style.color = white;
  $("kEquity").style.textShadow = "0 0 14px rgba(74,163,255,.18), 0 0 22px rgba(74,163,255,.10)";
  $("kRisk").style.color = white;
  $("kRisk").style.textShadow = "0 0 14px rgba(74,163,255,.18), 0 0 22px rgba(74,163,255,.10)";

  // Meta line
  const stand = lastRow?.date ?? "—";
  const updated = meta?.meta?.last_updated_utc ?? meta?.last_updated_utc ?? "—";
  $("metaLine").firstChild.textContent = `Stand: ${stand} · Updated: ${updated}  `;

  // Chart data build (calendar spine, carry-forward)
  const labels = equityRows.map(r => r.date);
  const equitySeries = equityRows.map(r => toNum(r.equity_end_$));

  // Cum R by date: sum daily R from trades_enriched if present in meta? -> for now:
  // We'll build from kpis/trades_enriched if you later add a daily R series file.
  // Here we compute CumR from equityRows if they contain daily_r_sum, else fallback to 0 line.
  let cumR = [];
  let running = 0;
  for(const r of equityRows){
    // if build_data later provides daily_r_sum, this will work automatically
    const dr = toNum(r.daily_r_sum ?? r.day_r_sum ?? r.r_sum ?? NaN);
    if(Number.isFinite(dr)) running += dr;
    cumR.push(running);
  }

  const canvas = $("curve");
  const btnEq = $("btnEquity");
  const btnR = $("btnR");
  const chartTitle = document.querySelector(".chart-title");

  function renderChart(){
    if(curveMode === "equity"){
      chartTitle.textContent = "Equity ($)";
      drawLineChart(canvas, equitySeries, labels, "equity");
    }else{
      chartTitle.textContent = "Cum R";
      drawLineChart(canvas, cumR, labels, "cumr");
    }
  }

  btnEq.addEventListener("click", ()=>{
    curveMode = "equity";
    btnEq.classList.add("active");
    btnR.classList.remove("active");
    renderChart();
  });
  btnR.addEventListener("click", ()=>{
    curveMode = "cumr";
    btnR.classList.add("active");
    btnEq.classList.remove("active");
    renderChart();
  });

  // First render
  renderChart();

  // Re-render on resize for better crispness (optional)
  window.addEventListener("resize", ()=>{
    // keep same fixed internal canvas size; this is just a repaint
    renderChart();
  });
}

main();
</script>

</body>
</html>
